      "type": "project"
    },
    {
      "id": "a2a4ac14-3363-4441-a38f-eeff67270efb",
      "text": "Select representative deviation scenario",
      "custom_tooltip": "<b>Select representative deviation scenario</b><br>Pick a single, realistic pilot deviation scenario (e.g., label attachment mismatch or seal integrity failure) that is likely based on early risks. Define the deviation\u2019s scope (which SKU(s), lot(s), time window), expected detectable evidence types, and the specific go/no-go implications. Produce a one-page drill scenario brief to align all participants.<br><b>Resources needed:</b><br><ul><li>QA lead</li><li>Label Release Owner</li><li>Packaging QA &amp; reseal/barrier specialist</li><li>Co-packer documentation control/ops lead</li><li>Food labeling/allergen compliance reviewer</li></ul>",
      "start_date": "2027-02-04",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "4c5af7a1-936e-4037-b97b-b607eb7b32d2 SS",
      "parent": "4c5af7a1-936e-4037-b97b-b607eb7b32d2"
    },
    {
      "id": "849235d2-0e3f-4a38-bfe7-bf535e904edc",
      "text": "Assemble drill binder evidence package",
      "custom_tooltip": "<b>Assemble drill binder evidence package</b><br>Create a mock hold/release drill binder that contains all required artifacts for the chosen scenario, including evidence indexes, document owners, revision status, and retrieval instructions. Populate sections with batch record extracts, COAs, label proofs/print IDs, allergen/cross-contact evidence, lot-to-label traceability outputs, and quarantine/disposition templates. Validate completeness before scheduling the drill.<br><b>Resources needed:</b><br><ul><li>Documentation control/records coordinator</li><li>Label Release &amp; lot-traceability coordinator</li><li>QA analyst</li><li>Allergen/compliance reviewer</li><li>Co-packer QA/admin support</li></ul>",
      "start_date": "2027-02-05",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "a2a4ac14-3363-4441-a38f-eeff67270efb FS",
      "parent": "4c5af7a1-936e-4037-b97b-b607eb7b32d2"
    },
    {
      "id": "28576ed8-aa2d-4f95-889c-5e1dce38e720",
      "text": "Run timed hold and release drill",
      "custom_tooltip": "<b>Run timed hold and release drill</b><br>Execute the tabletop drill end-to-end using the selected scenario with timed steps: request evidence \u2192 retrieve and verify \u2192 quarantine impacted scope \u2192 decide disposition \u2192 record CAPA/next actions. Use a checklist with required inputs for each step (e.g., lot/label mapping verification, seal integrity result lookup, evidence completeness confirmation). Log all delays, missing items, and decision rationales.<br><b>Resources needed:</b><br><ul><li>QA lead</li><li>Co-packer ops lead</li><li>Label Release Owner</li><li>Packaging QA specialist</li><li>Compliance reviewer (as needed)</li><li>Recorder/timekeeper</li></ul>",
      "start_date": "2027-02-06",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "849235d2-0e3f-4a38-bfe7-bf535e904edc FS",
      "parent": "4c5af7a1-936e-4037-b97b-b607eb7b32d2"
    },
    {
      "id": "98388e9d-9e16-4f4f-9796-7f035c5eca65",
      "text": "Verify 24-hour evidence retrieval SLA",
      "custom_tooltip": "<b>Verify 24-hour evidence retrieval SLA</b><br>Assess whether the binder and workflows meet the 24-hour evidence retrieval and response readiness target for the drill scenario. Score performance by: time-to-retrieve each required artifact, time-to-identify affected lots, traceability completeness, and decision turnaround. Produce a short discrepancy log and categorize gaps as documentation, process, or ownership/RACI issues.<br><b>Resources needed:</b><br><ul><li>QA lead</li><li>Documentation control/records coordinator</li><li>Traceability data owner</li><li>Project/milestone lead</li></ul>",
      "start_date": "2027-02-07",
      "duration": 1.0,
      "progress": 0,

    {
      "id": "eb8fdfbe-562c-480e-a899-e1517025f4b2",
      "text": "Close gaps with CAPA and updates",
      "custom_tooltip": "<b>Close gaps with CAPA and updates</b><br>Convert drill findings into corrective/preventive actions (CAPA): update binder content, improve evidence indexing, revise checklists, adjust RACI/authority language, and (if needed) modify traceability drill templates or co-packer workflow steps. Re-approve any modified artifacts with the Label Release Owner and QA/compliance reviewer, and confirm the drill binder is ready for re-use in future pilot audit walks.<br><b>Resources needed:</b><br><ul><li>CAPA owner (QA or compliance lead)</li><li>Label Release Owner</li><li>Documentation control/records coordinator</li><li>Co-packer QA/ops lead</li><li>Food labeling/allergen compliance reviewer</li></ul>",
      "start_date": "2027-02-08",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "4c5af7a1-936e-4037-b97b-b607eb7b32d2 FF, 98388e9d-9e16-4f4f-9796-7f035c5eca65 FS",
      "parent": "4c5af7a1-936e-4037-b97b-b607eb7b32d2"
    },
    {
      "id": "843e4818-e1e0-4e91-86b4-5bd871a8eebb",
      "text": "Perform pilot sensory review and final release minimums check for heat descriptors and quality timepoint evidence",
      "custom_tooltip": "<b>Perform pilot sensory review and final release minimums check for heat descriptors and quality timepoint evidence</b>",
      "progress": 0,
      "open": true,
      "meta": "4c5af7a1-936e-4037-b97b-b607eb7b32d2 FS",
      "parent": "78140dc2-1e6e-4851-aaf4-d88aa59522a6",
      "type": "project"
    },
    {
      "id": "906642c7-efba-4c6c-989a-1d177a96665c",
      "text": "Schedule pilot sensory review dates",
      "custom_tooltip": "<b>Schedule pilot sensory review dates</b><br>Lock sensory panel session dates and timepoints aligned to confirmed pilot batch completion times across all 3 SKUs. Confirm panelist availability (and backups), sample pull/transport windows, and standardized sample handling conditions so T0 and minimum-quality timepoint evaluations occur consistently.<br><b>Resources needed:</b><br><ul><li>Sensory science/consumer testing lead</li><li>Panel coordinator</li><li>QA lead</li><li>Co-packer/shared kitchen operations contact</li><li>Trained sample handlers</li></ul>",
      "start_date": "2027-02-09",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "843e4818-e1e0-4e91-86b4-5bd871a8eebb SS",
      "parent": "843e4818-e1e0-4e91-86b4-5bd871a8eebb"
    },
    {
      "id": "8bda0454-8ef2-4f74-9914-24e3898d23cb",
      "text": "Run final sensory check to release",
      "custom_tooltip": "<b>Run final sensory check to release</b><br>Conduct the final sensory review for all pilot lots using the locked rubric and heat descriptor governance rules. Score each sample at T0 and at the minimum-quality timepoint proxy, record results with SKU and lot codes, and verify each lot meets the predefined batch release minimums for heat descriptor governance and quality acceptance.<br><b>Resources needed:</b><br><ul><li>Sensory panelists</li><li>Sensory science/consumer testing lead</li><li>Heat QA lead</li><li>Data capture clerk or analyst</li><li>QA lead</li></ul>",
      "start_date": "2027-02-10",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "906642c7-efba-4c6c-989a-1d177a96665c FS",
      "parent": "843e4818-e1e0-4e91-86b4-5bd871a8eebb"
    },
    {
      "id": "faf13888-089c-4131-8efd-fbb0743c68b8",
      "text": "Apply release minimums and governance",
      "custom_tooltip": "<b>Apply release minimums and governance</b><br>Check each SKU/lot against the predefined final release minimums checklist (pass/fail criteria and evidence requirements). If any results are out-of-spec, apply the pre-approved decision levers (e.g., retest rules, confirmation sampling, or descriptor lock exception handling) without bypassing governance.<br><b>Resources needed:</b><br><ul><li>QA lead</li><li>Heat QA lead</li><li>Descriptor governance owner</li><li>Compliance/labeling reviewer (as needed)</li></ul>",
      "start_date": "2027-02-11",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "8bda0454-8ef2-4f74-9914-24e3898d23cb FS",
      "parent": "843e4818-e1e0-4e91-86b4-5bd871a8eebb"
    },
    {
      "id": "6c8edd58-c5ea-46fd-956f-17e80afa0b06",
      "text": "Document results and finalize descriptors",
      "custom_tooltip": "<b>Document results and finalize descriptors</b><br>Publish a short, review-ready sensory evidence packet that links all panel outcomes to lot codes and descriptor versions, including a discrepancy log (pass/fail, deviations, and resolution steps). Confirm which heat descriptor versions are supported for pilot release and which are rejected or deferred for correction.<br><b>Resources needed:</b><br><ul><li>Sensory science/consumer testing lead</li><li>Data manager (lot/descriptor mapping)</li><li>QA lead</li><li>Label release owner (for descriptor version confirmation)</li></ul>",
      "start_date": "2027-02-12",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "843e4818-e1e0-4e91-86b4-5bd871a8eebb FF, faf13888-089c-4131-8efd-fbb0743c68b8 FS",
      "parent": "843e4818-e1e0-4e91-86b4-5bd871a8eebb"
    },
    {
      "id": "70143d18-3755-4a95-826a-d8cd8e7a50db",
      "text": "Finalize and publish launch-readiness QA/label package (evidence binder and dashboards)",
      "custom_tooltip": "<b>Finalize and publish launch-readiness QA/label package (evidence binder and dashboards)</b>",
      "progress": 0,
      "open": true,
      "meta": "843e4818-e1e0-4e91-86b4-5bd871a8eebb FS",
      "parent": "78140dc2-1e6e-4851-aaf4-d88aa59522a6",
      "type": "project"
    },
    {
      "id": "24a07ddb-5079-4b3d-8f94-f734e9bbe142",
      "text": "Create evidence intake templates",
      "custom_tooltip": "<b>Create evidence intake templates</b><br>Define a single, versioned intake format and folder structure for all required launch-readiness artifacts (seal/packaging dashboard, traceability drill outputs, mock hold/release binder contents, heat claims + lot evidence matrix, and expert sign-off confirmations). Include completeness check fields, required document types, and artifact naming conventions to ensure consistent submission and review.<br><b>Resources needed:</b><br><ul><li>Project manager</li><li>QA/packaging lead</li><li>Label release &amp; traceability coordinator</li><li>Heat/sensory lead</li><li>Compliance/labeling reviewer</li></ul>",
      "start_date": "2027-02-13",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "70143d18-3755-4a95-826a-d8cd8e7a50db SS",
      "parent": "70143d18-3755-4a95-826a-d8cd8e7a50db"
    },
    {
      "id": "80e8b74a-0781-4ab2-b580-2662db10af1c",
      "text": "Collect and reconcile evidence artifacts",
      "custom_tooltip": "<b>Collect and reconcile evidence artifacts</b><br>Assemble all workstream outputs into the evidence intake structure. Perform a reconciliation pass to confirm each artifact is present, current (correct revision), and internally consistent (e.g., lot codes align across packaging, traceability, and heat evidence). Track gaps, discrepancies, and requested corrections with explicit owners and due dates.<br><b>Resources needed:</b><br><ul><li>Evidence coordinator</li><li>Co-packer/shared kitchen documentation lead</li><li>Packaging QA analyst</li><li>Traceability drill coordinator</li><li>Heat QA/sensory analyst</li></ul>",
      "start_date": "2027-02-14",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "24a07ddb-5079-4b3d-8f94-f734e9bbe142 FS",
      "parent": "70143d18-3755-4a95-826a-d8cd8e7a50db"
    },
    {
      "id": "158e3419-a29c-42c7-b3c1-d5118eaa42a3",
      "text": "Run completeness pre-check 48 hours",
      "custom_tooltip": "<b>Run completeness pre-check 48 hours</b><br>Execute a completeness and integrity audit 48 hours before final publication. Verify that no required evidence elements are missing, that numeric pass/fail thresholds are clearly captured, and that all drilled units and lots are accounted for. Produce a gap report and confirm corrective actions are closed or explicitly accepted with conditions.<br><b>Resources needed:</b><br><ul><li>QA/launch coordinator</li><li>Packaging QA lead</li><li>Label compliance/traceability lead</li><li>Project manager</li></ul>",
      "start_date": "2027-02-15",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "80e8b74a-0781-4ab2-b580-2662db10af1c FS",
      "parent": "70143d18-3755-4a95-826a-d8cd8e7a50db"
    },
    {
      "id": "43f41ef2-8014-4f3e-9017-c7147f20a540",
      "text": "Finalize and publish launch package",
      "custom_tooltip": "<b>Finalize and publish launch package</b><br>Consolidate reconciled artifacts into the final launch-readiness QA/label package (evidence binder and dashboards). Ensure a clean, review-ready layout with an index, executive summary of stop/go outcomes, and an audit trail (what changed from prior draft). Distribute the final package to stakeholders for sign-off and archive the versioned evidence set.<br><b>Resources needed:</b><br><ul><li>Evidence coordinator</li><li>Document control specialist (or QA admin)</li><li>Packaging QA lead</li><li>Label release &amp; traceability coordinator</li><li>Heat/sensory lead</li><li>Project manager</li></ul>",
      "start_date": "2027-02-16",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "158e3419-a29c-42c7-b3c1-d5118eaa42a3 FS",
      "parent": "70143d18-3755-4a95-826a-d8cd8e7a50db"
    },
    {
      "id": "d328e94a-7327-4563-a605-dfc7f306af07",
      "text": "Book sign-off readiness package review",
      "custom_tooltip": "<b>Book sign-off readiness package review</b><br>Prepare a sign-off meeting pre-read kit linked to decision criteria, including a checklist of required confirmations (zero label/traceability failures, seal integrity pass rates, descriptor governance compliance, and mock hold/release readiness). Confirm reviewer roster availability and ensure all open questions are resolved or captured with clear acceptance conditions ahead of go/no-go deliberation.<br><b>Resources needed:</b><br><ul><li>Project manager</li><li>QA/packaging lead</li><li>Compliance/labeling reviewer</li><li>Co-packer leadership representative</li><li>Traceability coordinator</li></ul>",
      "start_date": "2027-02-17",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "70143d18-3755-4a95-826a-d8cd8e7a50db FF, 43f41ef2-8014-4f3e-9017-c7147f20a540 FS",
      "parent": "70143d18-3755-4a95-826a-d8cd8e7a50db"
    },
    {
      "id": "6b2654cf-7d1b-4ec3-8e83-1abeac8331c5",
      "text": "Conduct final sign-off meeting with QA/labeling/compliance and co-packer leadership and issue go/no-go decision",
      "custom_tooltip": "<b>Conduct final sign-off meeting with QA/labeling/compliance and co-packer leadership and issue go/no-go decision</b>",
      "progress": 0,
      "open": true,
      "meta": "78140dc2-1e6e-4851-aaf4-d88aa59522a6 FF, 70143d18-3755-4a95-826a-d8cd8e7a50db FS",
      "parent": "78140dc2-1e6e-4851-aaf4-d88aa59522a6",
      "type": "project"
    },
    {
      "id": "b2ea5153-4aa9-41ff-ad19-49d894ace3f6",
      "text": "Schedule final sign-off meeting",
      "custom_tooltip": "<b>Schedule final sign-off meeting</b><br>Reserve a fixed calendar slot and confirm attendee roster (QA, labeling/compliance, co-packer leadership). Distribute a sign-off agenda and circulate the readiness decision criteria in advance so the meeting outcome can be finalized without last-minute scope additions.<br><b>Resources needed:</b><br><ul><li>Project milestone lead</li><li>QA lead</li><li>Labeling/compliance reviewer</li><li>Co-packer leadership liaison</li><li>Administrative coordinator</li></ul>",
      "start_date": "2027-02-18",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "6b2654cf-7d1b-4ec3-8e83-1abeac8331c5 SS",
      "parent": "6b2654cf-7d1b-4ec3-8e83-1abeac8331c5"
    },
    {
      "id": "39531ecf-f887-4f44-9301-b59b474539e6",
      "text": "Pre-read readiness package review",
      "custom_tooltip": "<b>Pre-read readiness package review</b><br>Run a pre-read 24 hours before the meeting to confirm all required evidence is present and formatted correctly (seal integrity/reseal results, heat descriptor minimums, lot-to-label traceability drill outputs, mock hold/release binder contents, and pilot stop/go dashboards). Produce a short discrepancy list for any missing or unclear artifacts.<br><b>Resources needed:</b><br><ul><li>Project manager</li><li>QA/packaging lead</li><li>Label release owner</li><li>Documentation control owner</li><li>Data analyst (optional)</li></ul>",
      "start_date": "2027-02-19",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "b2ea5153-4aa9-41ff-ad19-49d894ace3f6 FS",
      "parent": "6b2654cf-7d1b-4ec3-8e83-1abeac8331c5"
    },
    {
      "id": "14d86e97-c799-466e-bc00-98cbcd6c2c99",
      "text": "Resolve open questions and gaps",
      "custom_tooltip": "<b>Resolve open questions and gaps</b><br>Close or formally triage any pre-read questions (e.g., interpret stop/go thresholds, validate zero mismatches, confirm exception handling is documented). For anything not fully resolved, define an explicit acceptance-with-conditions or rerun trigger, including owners and deadlines.<br><b>Resources needed:</b><br><ul><li>QA lead</li><li>Labeling/compliance specialist</li><li>Co-packer QA/documentation lead</li><li>Project milestone lead</li></ul>",
      "start_date": "2027-02-20",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "39531ecf-f887-4f44-9301-b59b474539e6 FS",
      "parent": "6b2654cf-7d1b-4ec3-8e83-1abeac8331c5"
    },
    {
      "id": "c6c43ceb-cc1e-4592-96a6-442f716440f1",
      "text": "Conduct go/no-go decision meeting",
      "custom_tooltip": "<b>Conduct go/no-go decision meeting</b><br>Hold the final sign-off meeting and make the go/no-go call using the pre-agreed pilot outputs and thresholds. Capture the decision rationale, any conditions, and the contingency pathway if no-go (e.g., revert to simpler packaging configuration or re-run the specific failed evidence type).<br><b>Resources needed:</b><br><ul><li>Project milestone lead (decision authority)</li><li>QA/packaging lead</li><li>Labeling/compliance reviewer</li><li>Co-packer leadership</li><li>Note-taker</li></ul>",
      "start_date": "2027-02-21",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "14d86e97-c799-466e-bc00-98cbcd6c2c99 FS",
      "parent": "6b2654cf-7d1b-4ec3-8e83-1abeac8331c5"
    },
    {
      "id": "993e00f6-2c3f-472b-8ec5-039e93e00859",
      "text": "Publish sign-off minutes and actions",
      "custom_tooltip": "<b>Publish sign-off minutes and actions</b><br>Issue signed meeting minutes and an action log. Include the final launch-readiness status, list of conditions (if any), owners, and due dates. Ensure downstream teams receive the correct go/no-go directives and the latest versioned evidence references.<br><b>Resources needed:</b><br><ul><li>Project manager</li><li>Documentation control owner</li><li>Evidence binder/dashboard owner(s)</li><li>Communication lead (internal)</li></ul>",
      "start_date": "2027-02-22",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "6b2654cf-7d1b-4ec3-8e83-1abeac8331c5 FF, c6c43ceb-cc1e-4592-96a6-442f716440f1 FS",
      "parent": "6b2654cf-7d1b-4ec3-8e83-1abeac8331c5"
    }

    function zoomFit() {
        const tasks = gantt.getTaskByTime();
        if (tasks.length > 0) {
            const firstTask = tasks[0];
            const lastTask = tasks[tasks.length - 1];
            gantt.showDate(firstTask.start_date);
            
            // Calculate total duration in days
            const startDate = new Date(firstTask.start_date);
            const endDate = new Date(lastTask.end_date);
            const durationDays = (endDate - startDate) / (1000 * 60 * 60 * 24);
            
            // Choose appropriate scale based on duration
            if (durationDays > 3650) { // More than 10 years
                gantt.config.scale_unit = "year";
                gantt.config.step = 10;
                gantt.config.subscales = [
                    {unit: "year", step: 1, date: "%Y"}
                ];
            } else if (durationDays > 365) { // More than 1 year
                gantt.config.scale_unit = "year";
                gantt.config.step = 1;
                gantt.config.subscales = [
                    {unit: "month", step: 1, date: "%M"}
                ];
            } else if (durationDays > 30) { // More than 1 month
                gantt.config.scale_unit = "month";
                gantt.config.step = 1;
                gantt.config.subscales = [
                    {unit: "day", step: 1, date: "%d"}
                ];
            } else if (durationDays > 7) { // More than 1 week
                gantt.config.scale_unit = "week";
                gantt.config.step = 1;
                gantt.config.subscales = [
                    {unit: "day", step: 1, date: "%d"}
                ];
            } else {
                gantt.config.scale_unit = "day";
                gantt.config.step = 1;
                gantt.config.subscales = [];
            }
            gantt.render();
        }
    }

    function zoomIn() {
        const currentUnit = gantt.config.scale_unit;
        const currentStep = gantt.config.step;
        
        if (currentUnit === "year" && currentStep === 10) {
            gantt.config.scale_unit = "year";
            gantt.config.step = 1;
            gantt.config.subscales = [
                {unit: "month", step: 1, date: "%M"}
            ];
        } else if (currentUnit === "year") {
            gantt.config.scale_unit = "month";
            gantt.config.step = 1;
            gantt.config.subscales = [
                {unit: "day", step: 1, date: "%d"}
            ];
        } else if (currentUnit === "month") {
            gantt.config.scale_unit = "week";
            gantt.config.step = 1;
            gantt.config.subscales = [
                {unit: "day", step: 1, date: "%d"}
            ];
        } else if (currentUnit === "week") {
            gantt.config.scale_unit = "day";
            gantt.config.step = 1;
            gantt.config.subscales = [];
        }
        gantt.render();
    }

    function zoomOut() {
        const currentUnit = gantt.config.scale_unit;
        const currentStep = gantt.config.step;
        
        if (currentUnit === "day") {
            gantt.config.scale_unit = "week";
            gantt.config.step = 1;
            gantt.config.subscales = [
                {unit: "day", step: 1, date: "%d"}
            ];
        } else if (currentUnit === "week") {
            gantt.config.scale_unit = "month";
            gantt.config.step = 1;
            gantt.config.subscales = [
                {unit: "day", step: 1, date: "%d"}
            ];
        } else if (currentUnit === "month") {
            gantt.config.scale_unit = "year";
            gantt.config.step = 1;
            gantt.config.subscales = [
                {unit: "month", step: 1, date: "%M"}
            ];
        } else if (currentUnit === "year") {
            gantt.config.scale_unit = "year";
            gantt.config.step = 10;
            gantt.config.subscales = [
                {unit: "year", step: 1, date: "%Y"}
            ];
        }
        gantt.render();
    }

    function downloadCSV() {
        if (GANTT_DATA_CSV === null) {
            return;
        }
        const blob = new Blob([GANTT_DATA_CSV], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.setAttribute('href', url);
        link.setAttribute('download', GANTT_FILENAME_CSV);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Gantt Initialization
    gantt.config.readonly = true;
    gantt.config.date_format = "%Y-%m-%d";
    gantt.config.scale_unit = "month";
    gantt.config.step = 1;
    gantt.config.subscales = [
        {unit: "day", step: 1, date: "%d"}
    ];

    gantt.config.columns = [
        {name:"text", label:"Task name", width:"*", tree:true},
        // {name:"start_date", label:"Start time", align: "center"},
        // {name:"duration", label:"Duration", align: "center"}
    ];

    gantt.templates.task_class = function(start, end, task) {
        if (task.type === "project") {
            return "project-task";
        }
        return "";
    };

    gantt.templates.tooltip_text = function(start, end, task) {
        return task.custom_tooltip || "No tooltip";
    };
    
	gantt.plugins({
		tooltip: true
	});
	gantt.attachEvent("onGanttReady", function(){
		var tooltips = gantt.ext.tooltips;
		tooltips.tooltip.setViewport(gantt.$task_data);
	});
    gantt.init("gantt_container");
    gantt.parse(GANTT_DATA_DHTMLX);

    // Hide the export to CSV button if there is no CSV data
    if (GANTT_DATA_CSV === null) {
        document.getElementById('exportToCSVButton').style.display = 'none';
    }

    document.getElementById('zoomFitButton').addEventListener('click', zoomFit);
    document.getElementById('zoomInButton').addEventListener('click', zoomIn);
    document.getElementById('zoomOutButton').addEventListener('click', zoomOut);
    document.getElementById('exportToCSVButton').addEventListener('click', downloadCSV);
</script>
