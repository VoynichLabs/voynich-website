    {
      "id": "b6f46c96-8fb0-4a59-bef2-476273df5699",
      "text": "Assemble packaging test matrix",
      "custom_tooltip": "<b>Assemble packaging test matrix</b><br>Create the packaging feasibility test matrix that spans the minimum decision-driving conditions needed for stop/go decisions. Define the factorial structure (pouch variant vs seal parameter window vs aging condition vs abuse scenario), constrain the matrix to what can be executed within pilot sample capacity, and predefine required data fields for each test condition so results are comparable across SKUs.<br><b>Resources needed:</b><br><ul><li>Packaging QA &amp; Reseal/Barrier Validation Specialist</li><li>Food Packaging Engineer</li><li>Co-packer/shared kitchen QA lead</li><li>Packaging data analyst</li></ul>",

    },
    {
      "id": "cec4490d-a64c-4b5f-9652-0f19d3a781f7",
      "text": "Compute sample sizes and confidence",
      "custom_tooltip": "<b>Compute sample sizes and confidence</b><br>Estimate required sample counts per condition using conservative variance assumptions for seal integrity pass rate and for reseal/leak/ingress outcomes. Calculate stop/go trigger thresholds using binomial confidence intervals (e.g., abort if failures exceed predefined limits) and document the rationale and assumptions so the decision criteria can be applied consistently during pilot execution.<br><b>Resources needed:</b><br><ul><li>Packaging data analyst</li><li>Packaging QA &amp; Reseal/Barrier Validation Specialist</li><li>Food Packaging Engineer</li><li>Quality statistician (optional)</li></ul>",
      "start_date": "2026-05-03",
      "duration": 3.0,
      "progress": 0,
      "open": true,
      "meta": "b6f46c96-8fb0-4a59-bef2-476273df5699 FS",

    },
    {
      "id": "14610048-43ce-4108-827a-3d66ef1f88c7",
      "text": "Freeze acceptance thresholds and criteria",
      "custom_tooltip": "<b>Freeze acceptance thresholds and criteria</b><br>Lock numeric acceptance criteria for seal integrity pass rate, reseal-cycle performance, leak/ingress failure definitions, and acceptable damage-rate deltas (including insert vs no-insert comparisons, if applicable). Include calibration/measurement prerequisites, pass/fail logic, re-test triggers for ambiguous failures, and the exact record-keeping required to support decisions.<br><b>Resources needed:</b><br><ul><li>Food Packaging Engineer</li><li>Packaging QA &amp; Reseal/Barrier Validation Specialist</li><li>Co-packer/shared kitchen QA lead</li><li>Project milestone lead</li></ul>",

    },
    {
      "id": "9b8b692c-cbba-4c47-923f-6265b7e15258",
      "text": "Prepare test execution checklist",
      "custom_tooltip": "<b>Prepare test execution checklist</b><br>Develop a run-ready execution plan for pilot testing: define run order, sample labeling scheme, condition setpoints to be used on the line, required instrument calibration checks, data capture template, and responsibilities for each measurement step. Include controls for preventing operator drift and a change-control approach if any line parameter adjustments occur mid-run.<br><b>Resources needed:</b><br><ul><li>Packaging QA &amp; Reseal/Barrier Validation Specialist</li><li>Co-packer/shared kitchen line operator</li><li>Lab/measurement technician</li><li>Documentation controller</li></ul>",

    {
      "id": "f053c386-22d3-464a-9f16-a2b6c2dfa759",
      "text": "Define abuse and warming test matrix",
      "custom_tooltip": "<b>Define abuse and warming test matrix</b><br>Create a test matrix that represents CT/RI market usage and worst-case handling: warm ambient storage/staging duration, stacking/jostle/vibration exposure, orientation rules, and maximum booth handling time. Specify temperature/time profiles, acceptance observation points, sample counts, and a mapping from observed defect modes to upstream causes for later root-cause analysis.<br><b>Resources needed:</b><br><ul><li>DTC logistics lead</li><li>Packaging QA lead</li><li>Test method owner (QA or packaging engineer)</li><li>Data analyst (for test matrix and sample sizing)</li></ul>",

    {
      "id": "5a6d2d07-bea0-4c89-85dc-6ac13d4ba9f0",
      "text": "Prepare materials, devices, and controls",
      "custom_tooltip": "<b>Prepare materials, devices, and controls</b><br>Secure and stage shipping cartons, insulation/cushion components, probe/indicator tools (e.g., data loggers), vibration/impact or vibration-analog equipment, and any temperature-controlled staging resources. Calibrate/verify instruments, define control samples, label/lot coding for traceability, and document chain-of-custody and storage conditions for every test unit.<br><b>Resources needed:</b><br><ul><li>Logistics/test coordinator</li><li>Packaging engineer or technician</li><li>QA documentation owner</li><li>Calibration/instrumentation support</li></ul>",

    },
    {
      "id": "ad55ec6f-b927-42d8-913f-8d7761ece9fe",
      "text": "Run transit and worst-case simulations",
      "custom_tooltip": "<b>Run transit and worst-case simulations</b><br>Execute the full set of shipping abuse simulations for the pilot DTC configuration(s), applying the defined temperature/time and handling stressors. Capture in-run data (temperature logger traces, handling timestamps), record packaging condition immediately after tests, and perform initial damage/seal inspections under a standardized defect taxonomy.<br><b>Resources needed:</b><br><ul><li>Test execution team</li><li>Packaging QA inspector</li><li>Data logger operator</li><li>Safety/handling support</li></ul>",
      "start_date": "2026-05-14",
      "duration": 1.0,
      "progress": 0,
      "open": true,

    },
    {
      "id": "2677ba48-9157-4443-be89-00e2fc8dc08d",
      "text": "Analyze defects and update incident modes",
      "custom_tooltip": "<b>Analyze defects and update incident modes</b><br>Analyze results to quantify damage rate and defect-mode distribution by scenario (and by SKU/lot configuration). Map each defect/claim-relevant outcome to the upstream packaging risk categories (seal integrity, reseal performance, barrier/heat loss, creasing, insert interference, label interference). Summarize what changes are needed to pass the DTC stop/go targets and identify any scenario failures that trigger configuration or process parameter adjustments.<br><b>Resources needed:</b><br><ul><li>Packaging QA lead</li><li>Data analyst</li><li>Packaging engineer</li><li>DTC ops lead</li></ul>",
      "start_date": "2026-05-15",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "ad55ec6f-b927-42d8-913f-8d7761ece9fe FS",
      "parent": "8791a9b5-2855-461e-8355-d4839a9f6b90"
    },
    {
      "id": "8828100a-da91-4c00-96ab-ac4fcdd07892",
      "text": "Calibrate cutoff decisions to evidence",
      "custom_tooltip": "<b>Calibrate cutoff decisions to evidence</b><br>Translate simulation findings into practical go/no-go guidance for DTC shipping cutoffs and packing configuration: verify which scenarios meet or fail the predefined incident/damage thresholds, propose the maximum acceptable staging/handling parameters, and produce an evidence-backed decision memo for upstream stakeholders to lock the DTC policy.<br><b>Resources needed:</b><br><ul><li>DTC logistics lead</li><li>Packaging QA lead</li><li>Project/milestone lead</li><li>Cross-functional reviewer (co-packer/ops)</li></ul>",

      "duration": 1.0,

      "text": "Analyze pilot results and calculate pass/fail outcomes for seal, reseal, barrier, and damage modes",

    {
      "id": "b0215ac5-6473-42f1-adfa-6de960f033ad",
      "text": "Standardize dry-first heat carrier specs",
      "custom_tooltip": "<b>Standardize dry-first heat carrier specs</b><br>Define the exact dry-first heat/spice carrier approach for all three SKUs, including spice blend composition targets, mixing order-of-operations, rest/hold time, and post-mix timing requirements that must be executable at the co-packer/shared kitchen. Deliver SKU-level mixing parameter targets and a bench-to-line translation checklist for co-packer execution.<br><b>Resources needed:</b><br><ul><li>Flavor Formulation &amp; Heat QA Lead</li><li>Co-packer/shared kitchen process engineer</li><li>QA/Documentation lead</li><li>Pilot batching operator</li></ul>",

    {
      "id": "5f5c4c94-d5be-496b-8473-c85f7ad3ac1e",
      "text": "Lock mixing time windows and tolerances",
      "custom_tooltip": "<b>Lock mixing time windows and tolerances</b><br>Create measurable mixing discipline controls (start/stop rules, allowable variance bands, documentation fields, and corrective action triggers) to keep heat consistency stable across runs. Validate the process window can be executed on the actual line by running a small pre-pilot validation mix and updating the controlled batch record steps accordingly.<br><b>Resources needed:</b><br><ul><li>Flavor Formulation &amp; Heat QA Lead</li><li>Co-packer/shared kitchen QA lead</li><li>Operations/process supervisor</li><li>Data analyst</li></ul>",
      "start_date": "2026-05-18",

    {
      "id": "610c1e1b-4c51-432b-a07a-3a62f82ef25a",
      "text": "Define heat descriptors and governance",
      "custom_tooltip": "<b>Define heat descriptors and governance</b><br>Establish the approved heat descriptor set and heat scale levels (e.g., descriptor text, leveling definitions) and a governance workflow for when/how descriptors may be changed. Assign a single owner for descriptor updates, set decision levers (what sensory/lot evidence is required), and implement a descriptor lock gate tied to pilot sensory outcomes to prevent unsupported edits.<br><b>Resources needed:</b><br><ul><li>Food labeling/compliance specialist</li><li>Flavor Formulation &amp; Heat QA Lead</li><li>Project owner</li><li>Label Release Owner (or delegate)</li><li>Documentation control/QMS coordinator</li></ul>",

      "parent": "1a4e7552-130e-4da5-9b88-ccbf21dd62a9"
    },
    {
      "id": "f1ac61ff-f94e-409e-a900-be5c88b7faaf",
      "text": "Build sensory rubric and panel training",
      "custom_tooltip": "<b>Build sensory rubric and panel training</b><br>Develop and document the sensory panel protocol and rubric for onset, intensity, aroma persistence, and afterburn, including definitions and failure/ambiguity handling. Conduct panel training/calibration using representative reference samples and finalize scoring sheets and sampling/storage SOPs to ensure repeatability between sessions and runs.<br><b>Resources needed:</b><br><ul><li>Sensory science &amp; consumer testing lead</li><li>Trained sensory panelists</li><li>Flavor Formulation &amp; Heat QA Lead</li><li>Sample handling coordinator</li></ul>",

      "parent": "1a4e7552-130e-4da5-9b88-ccbf21dd62a9"
    },
    {
      "id": "c869d1ee-afdb-4b93-bf27-b6d1804f566f",
      "text": "Run lot-coded T0 and quality timepoints",
      "custom_tooltip": "<b>Run lot-coded T0 and quality timepoints</b><br>Execute sensory evaluations at T0 and a minimum-quality timepoint proxy for each SKU across pilot/production runs. Link every sensory sample to its exact lot code, roast/pack timing, descriptor version, and storage condition, then compile a heat claims + lot evidence matrix. Confirm descriptor accuracy KPI performance against the predefined threshold and ensure every descriptor used is supported by the evidence matrix.<br><b>Resources needed:</b><br><ul><li>Sensory science &amp; consumer testing lead</li><li>Panel coordinator</li><li>QA/lot traceability coordinator</li><li>Data analyst</li><li>Co-packer/shared kitchen sampler</li></ul>",
      "start_date": "2026-05-21",
      "duration": 1.0,
      "progress": 0,
      "open": true,

    },

      "text": "Obtain expert sign-off (packaging engineer + co-packer QA) and publish packaging pass/fail dashboard",

    {
      "id": "dcea238b-55a1-43db-9f7c-1a118aa0f7f3",
      "text": "Design heat descriptor governance workflow",
      "custom_tooltip": "<b>Design heat descriptor governance workflow</b><br>Define how heat/spice descriptor text is chosen, changed, frozen, and tied to evidence. Include: descriptor taxonomy/levels, ownership (single governor), approval gates, decision levers (what evidence is required), and an explicit descriptor lock date tied to pilot sensory results to prevent late churn. Deliver a governance SOP plus the change-control form and required signatories.<br><b>Resources needed:</b><br><ul><li>Flavor formulation &amp; heat QA lead</li><li>Sensory science &amp; consumer testing lead</li><li>Food labeling and allergen compliance specialist</li><li>Project milestone lead</li><li>Document controller</li></ul>",

    },
    {
      "id": "33dbd087-2c77-46cb-9520-6e85ff15af15",
      "text": "Build sensory rubric and panel training",
      "custom_tooltip": "<b>Build sensory rubric and panel training</b><br>Create the sensory scoring rubric and supporting materials for heat perception. Cover onset, intensity, aroma persistence, afterburn/lingering, and definitions for each heat level category. Prepare reference/anchor samples or comparable training standards, run panel training/calibration sessions, document inter-panelist alignment targets, and finalize a version-controlled rubric template ready for pilot evaluations.<br><b>Resources needed:</b><br><ul><li>Sensory science &amp; consumer testing lead</li><li>Flavor formulation &amp; heat QA lead</li><li>Panel coordinator/tasters</li><li>Data analyst for rubric repeatability checks</li><li>Compliance reviewer (claims guardrails)</li></ul>",

    },
    {
      "id": "6a6b496e-4bd7-438a-9248-b690b56e4ad8",
      "text": "Run sensory evaluations at T0 and proxy",
      "custom_tooltip": "<b>Run sensory evaluations at T0 and proxy</b><br>Execute sensory tastings for all 3 SKUs across pilot runs using standardized sample handling and timing. Collect required evidence at: T0 (packaging time) and a minimum-quality timepoint proxy aligned to worst-case handling/storage assumptions. Ensure lot-coded tracking for every sample, enforce storage conditions and serving protocols, and record results to the finalized rubric with traceable versioning.<br><b>Resources needed:</b><br><ul><li>Co-packer/shared kitchen QA liaison</li><li>Sensory panelists</li><li>Sensory science &amp; consumer testing lead</li><li>Flavor formulation &amp; heat QA lead</li><li>Sample handling coordinator</li></ul>",

      "duration": 1.0,

      "meta": "33dbd087-2c77-46cb-9520-6e85ff15af15 FS",
      "parent": "a13d72c5-be76-4089-91df-b8a3a83e5abf"
    },
    {
      "id": "bbc90673-2dc1-4abf-87e4-659ae1a6704d",
      "text": "Link sensory results to lot evidence matrix",
      "custom_tooltip": "<b>Link sensory results to lot evidence matrix</b><br>Create and validate a heat claims + lot evidence matrix that connects SKU, finished-goods lot code, descriptor version used, sampling timepoint (T0 vs proxy), and sensory outcomes. Perform schema and referential integrity checks so there are no orphan lots or mismatched descriptor versions. Publish a traceable matrix report suitable for descriptor lock sign-off and downstream label/claim governance.<br><b>Resources needed:</b><br><ul><li>Data analyst (spreadsheet/schema validation)</li><li>Label heat descriptor governor</li><li>QA/package documentation controller</li><li>Sensory science &amp; consumer testing lead</li></ul>",

      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "a13d72c5-be76-4089-91df-b8a3a83e5abf FF, 6a6b496e-4bd7-438a-9248-b690b56e4ad8 FS",
      "parent": "a13d72c5-be76-4089-91df-b8a3a83e5abf"
    },

      "text": "Decide go/no-go (and fallback revert plan) for the functional label + pouch concept vs simpler configuration",

    {
      "id": "fc345419-36d2-494d-b05d-98975744a8f4",
      "text": "Assemble mock hold/release binder",
      "custom_tooltip": "<b>Assemble mock hold/release binder</b><br>Create the binder template and compile the required labeling and traceability evidence sections for a realistic hold/release response. Include an evidence index, document owner list, and retrieval SLAs targeting assembly and response within 24 hours. Ensure binder contents map to the labeling/traceability drill scenarios (e.g., label attachment discrepancy, artwork-to-lot mismatch). Deliverables: finalized binder structure, populated draft binder sections, and an evidence index that can be used during drills.<br><b>Resources needed:</b><br><ul><li>Label Release &amp; Lot-Traceability Coordinator</li><li>Food labeling/allergen compliance lead</li><li>QA documentation controller</li><li>Co-packer/shared kitchen documentation control lead</li><li>Project manager</li></ul>",

    {
      "id": "080f8374-973c-4613-9818-037f592d64d4",
      "text": "Define document ownership and SLAs",
      "custom_tooltip": "<b>Define document ownership and SLAs</b><br>Assign a single named owner for each evidence artifact in the binder (e.g., COAs, ingredient/allergen statements, label master proofs, label print/overprint identifiers, traceability mapping exports, quarantine disposition logs). Define the retrieval SLA for each owner and the escalation path if evidence cannot be retrieved within the 24-hour target. Deliverables: RACI matrix for binder contents, SLA sheet, escalation workflow, and a checklist of evidence completeness.<br><b>Resources needed:</b><br><ul><li>Label Release &amp; Lot-Traceability Coordinator</li><li>QA/Documentation controller</li><li>Compliance reviewer</li><li>Co-packer ops/QA representative</li></ul>",

    },
    {
      "id": "6294ec6e-bccc-494b-bb3e-c41d20d561eb",
      "text": "Rehearse binder retrieval drill",
      "custom_tooltip": "<b>Rehearse binder retrieval drill</b><br>Run a timed tabletop rehearsal (at least one representative deviation scenario) using the binder template to confirm the team can retrieve the needed evidence, interpret it correctly, and produce the required quarantine/release documentation. Record time-to-retrieve per evidence type, identify bottlenecks, and update the binder content formatting/versioning to close gaps. Deliverables: drill run notes, measured retrieval times vs 24-hour target, gap list, and binder revisions completed.<br><b>Resources needed:</b><br><ul><li>Label Release &amp; Lot-Traceability Coordinator</li><li>QA lead</li><li>Co-packer/shared kitchen QA lead</li><li>Food labeling/allergen compliance specialist</li><li>Project manager</li></ul>",

    },
    {
      "id": "213f9f01-1bbf-4f32-94e9-15e9ba36393b",
      "text": "Validate hold/release decision workflow",
      "custom_tooltip": "<b>Validate hold/release decision workflow</b><br>Confirm the end-to-end hold/release workflow for labeling/traceability deviations: quarantine scope rules, decision authority (who halts/ships/release), CAPA ownership mapping, and how outcomes are documented for audit readiness. Ensure the binder contents include all forms/checklists needed for the workflow and that the drill outcomes align with the workflow. Deliverables: approved decision-tree/RACI, quarantine scope rules document, CAPA ownership mapping, and binder cross-references to required forms.<br><b>Resources needed:</b><br><ul><li>Food safety/allergen &amp; regulatory compliance lead</li><li>QA lead</li><li>Label Release Owner</li><li>Co-packer ops lead</li><li>Project manager</li></ul>",

    {
      "id": "a6f01b86-45cc-4ef5-a317-80debed4c3bb",
      "text": "Finalize SKU ingredient/allergen lists",
      "custom_tooltip": "<b>Finalize SKU ingredient/allergen lists</b><br>Compile final ingredient lists for all three SKUs and finalize allergen/cross-contact declarations. For each SKU, confirm ingredient names, quantities/net quantity logic (as applicable), allergen formatting requirements, and whether any cross-contact statement is required based on supplier evidence. Produce an SKU-by-SKU label-claims specification draft ready for label master artwork review.<br><b>Resources needed:</b><br><ul><li>Food labeling and compliance lead</li><li>Regulatory/labeling consultant (if available)</li><li>QA lead</li><li>Procurement/supplier documentation coordinator</li></ul>",

    {
      "id": "08d1bdac-0213-44cd-ba5f-e1373f0c5a2c",
      "text": "Resolve supplier cross-contact evidence gaps",
      "custom_tooltip": "<b>Resolve supplier cross-contact evidence gaps</b><br>Review supplier-provided allergen/cross-contact documentation against the needs of the three SKU label set. Identify missing, conflicting, or noncomparable statements and drive resolution with suppliers (e.g., updated letters, revised COAs, effective dates, facility controls descriptions). Update the SKU label-claims specification only when the evidence is complete and defensible.<br><b>Resources needed:</b><br><ul><li>Supplier documentation coordinator</li><li>Food safety/HACCP lead (as needed)</li><li>QA lead</li><li>Supplier contacts</li></ul>",

    {
      "id": "74d6f82a-d025-4d00-b585-39dc1aae947c",
      "text": "Confirm allergen wording formatting standards",
      "custom_tooltip": "<b>Confirm allergen wording formatting standards</b><br>Ensure allergen declarations and ingredient formatting follow FDA-aligned labeling conventions and internal brand governance. Validate the consistency of allergen capitalization, \u201ccontains/may contain\u201d usage (as appropriate), ingredient order, and any special statements required for nuts/spices handling. Deliver a final approved wording pack per SKU for label master control.<br><b>Resources needed:</b><br><ul><li>Food labeling and compliance lead</li><li>Label release owner</li><li>QA lead</li></ul>",

    {
      "id": "37342102-39f9-4f82-a1ba-c7e6db43addf",
      "text": "Publish SKU label-claims specification draft",
      "custom_tooltip": "<b>Publish SKU label-claims specification draft</b><br>Package the finalized ingredient lists and allergen/cross-contact declarations into a controlled document set (versioned). Provide outputs in a format that can be directly consumed by the label master artwork workstream, including SKU identifiers, proposed allergen text blocks, and evidence references (what supplier document supports each statement).<br><b>Resources needed:</b><br><ul><li>Label release owner</li><li>Documentation/control coordinator</li><li>QA lead</li><li>Food labeling and compliance lead</li></ul>",

    {
      "id": "80ba2e27-f46c-4274-ba69-b97039529d91",
      "text": "Request complete COAs and allergen evidence",
      "custom_tooltip": "<b>Request complete COAs and allergen evidence</b><br>Create and send a standardized supplier documentation checklist for all 3 SKUs, specifying the required fields for COAs, allergen/cross-contact statements, effective dates, and any lot identifiers needed for later lot-to-label traceability. Track responses in a single tracker and enforce clear submission deadlines with escalation if incomplete or inconsistent.<br><b>Resources needed:</b><br><ul><li>Food safety/allergen compliance lead</li><li>Label release &amp; lot-traceability coordinator</li><li>Procurement/supplier manager</li><li>Supplier documentation owner(s) from each nut/spice supplier</li><li>Project manager (documentation tracking)</li></ul>",

    {
      "id": "8884391a-9e0e-4e97-b643-5b6c3033b95b",
      "text": "Validate COA lot identifiers match scope",
      "custom_tooltip": "<b>Validate COA lot identifiers match scope</b><br>Perform a structured completeness and consistency review of received COAs and allergen evidence for each SKU: verify required fields are present, lot identifiers are usable, units are consistent, and the evidence corresponds to the intended ingredients. Flag gaps or mismatches (missing lot numbers, unclear allergen wording, conflicting cross-contact statements) and request corrected documentation before artwork build.<br><b>Resources needed:</b><br><ul><li>Label release &amp; lot-traceability coordinator</li><li>Food safety/allergen compliance lead</li><li>Quality documentation reviewer</li><li>Supplier contact(s)</li></ul>",

    {
      "id": "31916453-2f79-48de-82a0-8263fed2e905",
      "text": "Map supplier evidence to SKU label inputs",
      "custom_tooltip": "<b>Map supplier evidence to SKU label inputs</b><br>Translate supplier documentation into a label master input record for each SKU, including: ingredient list evidence basis, allergen declaration basis, and any cross-contact statements or sanitation-related claims evidence. Produce a per-SKU evidence summary that can be directly referenced during label master creation and later hold/release documentation assembly.<br><b>Resources needed:</b><br><ul><li>Food safety/allergen compliance lead</li><li>Label release &amp; lot-traceability coordinator</li><li>Regulatory/labeling consultant (as needed)</li><li>Documentation specialist</li></ul>",

    {
      "id": "59974a97-1eef-446a-81e4-3cb1847fd52d",
      "text": "Run label readiness evidence pre-check",
      "custom_tooltip": "<b>Run label readiness evidence pre-check</b><br>Conduct an internal pre-check to confirm that all required supplier evidence is ready for label master creation and that there are no blocking gaps (missing COA fields, missing allergen/cross-contact support, unusable lot identifiers). Produce a gap log with severity status (blocking vs non-blocking) and obtain approval to proceed to label master artwork compilation.<br><b>Resources needed:</b><br><ul><li>Food safety/allergen compliance lead</li><li>Label release &amp; lot-traceability coordinator</li><li>QA lead</li><li>Project manager</li></ul>",

    {
      "id": "dcb36a9d-b059-475f-8f95-5ca464890e13",
      "text": "Draft label master artwork set",
      "custom_tooltip": "<b>Draft label master artwork set</b><br>Create controlled label master templates for all 3 SKUs with locked variable fields (SKU name, net quantity, ingredient list order, allergen declarations, heat descriptor text/scale level, lot/pack fields, and any required manufacturer/distributor statements). Establish artwork version identifiers and effective date rules so co-packer printing can be unambiguously tied to the correct master.<br><b>Resources needed:</b><br><ul><li>Food labeling and allergen compliance lead</li><li>Label designer/artwork specialist</li><li>Label release owner</li><li>Nutrition/labeling consultant (if applicable)</li></ul>",

    {
      "id": "ddb8c72d-89cf-4099-91c7-e677762bbe96",
      "text": "Run allergen and claim compliance review",
      "custom_tooltip": "<b>Run allergen and claim compliance review</b><br>Perform a structured compliance review of each SKU\u2019s label master for FDA-aligned formatting, allergen language accuracy, ingredient and declaration consistency, and substantiation alignment for any quality/heat wording. Capture discrepancies in a single log and iterate the master set until all items pass without open questions.<br><b>Resources needed:</b><br><ul><li>Food labeling and allergen compliance lead</li><li>Regulatory/labeling reviewer</li><li>QA lead</li><li>Documentation control coordinator</li></ul>",

    {
      "id": "f5429030-ea88-40cc-8b9e-1a8bc20ba987",
      "text": "Finalize co-packer print and attachment specs",
      "custom_tooltip": "<b>Finalize co-packer print and attachment specs</b><br>Translate the label master into co-packer-ready execution specs: required label size/placement, lot code/print overprint fields, overprint readability tolerances, adhesion/print contrast considerations, and any label/placement checks that must be performed on the line. Provide proof-ready print-ready files and a revision-controlled labeling package for pilot runs.<br><b>Resources needed:</b><br><ul><li>Co-packer/shared kitchen QA lead</li><li>Packaging engineering liaison (if needed)</li><li>Label release owner</li><li>Co-packer operations representative</li></ul>",

    {
      "id": "2e3efa42-8076-4c84-b729-7532ae355a6c",
      "text": "Proof, lock, and release label artwork",
      "custom_tooltip": "<b>Proof, lock, and release label artwork</b><br>Generate and review final proofs (visual and, if applicable, machine-readability/lot-code legibility checks). Confirm artwork revision IDs map to the correct SKU heat descriptor versions and lot-code fields. Lock the descriptor/version set in the label master control system and authorize release for use in pilot labeling with a documented approval trail.<br><b>Resources needed:</b><br><ul><li>Label designer/artwork specialist</li><li>Food labeling and allergen compliance lead</li><li>Label release owner</li><li>Co-packer QA lead</li></ul>",

      "text": "Define co-packer/shared kitchen labeling workflow (label print identifiers, overprint tolerances, attachment verification)",
      "custom_tooltip": "<b>Define co-packer/shared kitchen labeling workflow (label print identifiers, overprint tolerances, attachment verification)</b>",

    {
      "id": "413b1d8e-bf26-4f14-8aac-fe4b71254e2d",
      "text": "Create label master control template",
      "custom_tooltip": "<b>Create label master control template</b><br>Define the controlled label master structure for all 3 SKUs, including variable fields and required controls. Establish: version naming and effective-date rules, heat-descriptor text governed by sensory versions, net quantity display fields, lot code/label code fields, and manufacturer/distributor/establishment statements as applicable. Produce a single template that can be completed consistently and used for proofs, audits, and co-packer printing/overprint alignment.<br><b>Resources needed:</b><br><ul><li>Food labeling and allergen compliance lead</li><li>Label release owner</li><li>Regulatory/labeling consultant (if used)</li><li>Design/label production specialist</li><li>Document control coordinator</li></ul>",
      "start_date": "2026-07-01",

    },
    {
      "id": "83e863ea-7d0b-4534-b2ef-97fa8ff4b344",
      "text": "Draft compliant SKU label artwork set",
      "custom_tooltip": "<b>Draft compliant SKU label artwork set</b><br>Create first-draft artwork for each of the 3 SKUs using finalized ingredient/allergen inputs and approved heat descriptor text placeholders. Ensure consistent allergen declaration formatting, ingredient order, net quantity, and claim language boundaries. Output compliant label proofs for internal review, with traceability fields aligned to the intended lot-to-label mapping (e.g., lot code location and label roll/print identifiers).<br><b>Resources needed:</b><br><ul><li>Food labeling and allergen compliance lead</li><li>Label release owner</li><li>Label artwork designer</li><li>QA/documentation support</li><li>Brand owner/decision authority</li></ul>",
      "start_date": "2026-07-03",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "413b1d8e-bf26-4f14-8aac-fe4b71254e2d FS",
      "parent": "93d4b8f4-83cb-425d-abf5-e98342ffefdd"
    },
    {
      "id": "0963c07b-1865-4ff9-87ea-247691a98007",
      "text": "Run label compliance review iterations",
      "custom_tooltip": "<b>Run label compliance review iterations</b><br>Execute a structured review cycle to resolve regulatory/format issues. Compare each draft against the compliance checklist: allergen formatting, ingredient listing, required statements, and heat descriptor governance constraints. If changes are requested, route them through change control and update only the affected sections/versions. Maintain an audit trail of approved revisions and freeze the descriptor version and net quantity details once approved.<br><b>Resources needed:</b><br><ul><li>Food labeling and allergen compliance lead</li><li>Label release owner</li><li>Regulatory/labeling consultant (if used)</li><li>Document control coordinator</li><li>Co-packer input reviewer</li></ul>",
      "start_date": "2026-07-05",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "83e863ea-7d0b-4534-b2ef-97fa8ff4b344 FS",
      "parent": "93d4b8f4-83cb-425d-abf5-e98342ffefdd"
    },
    {
      "id": "e84c15ea-f243-4fe9-8909-359971e2aa1c",
      "text": "Proof co-packer print and attachment fields",
      "custom_tooltip": "<b>Proof co-packer print and attachment fields</b><br>Validate the label master in the real-world print/attachment context. Confirm compatibility with co-packer workflow: label/roll identifiers (as overprinted or printed), overprint tolerances, label placement/adhesion requirements, readability at line speed, and correct alignment of lot code/print ID fields to traceability records. Produce final co-packer-ready proofs and a label master sign-off package that specifies which artwork revision is tied to which SKU and label version.<br><b>Resources needed:</b><br><ul><li>Co-packer/shared kitchen QA or labeling tech lead</li><li>Label release owner</li><li>Packaging/line operations contact</li><li>Document control coordinator</li><li>Artwork designer (for rapid proof updates)</li></ul>",
      "start_date": "2026-07-07",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "0963c07b-1865-4ff9-87ea-247691a98007 FS",
      "parent": "93d4b8f4-83cb-425d-abf5-e98342ffefdd"
    },
    {
      "id": "9abda1ce-0d6b-4cdf-b246-cd3e2a615c08",
      "text": "Finalize version control and release",
      "custom_tooltip": "<b>Finalize version control and release</b><br>Lock the final label master set with formal version control and approvals. Assign ownership for future descriptor/wording changes and ensure the effective descriptor version is frozen relative to sensory evidence. Publish the final label artwork set into the controlled repository, including: SKU-to-artwork mapping, revision IDs, effective dates, and the required documentation to enable traceability and hold/release decisions.<br><b>Resources needed:</b><br><ul><li>Label release owner</li><li>Food labeling and allergen compliance lead</li><li>Document control coordinator</li><li>QA sign-off authority</li><li>Co-packer liaison</li></ul>",
      "start_date": "2026-07-09",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "93d4b8f4-83cb-425d-abf5-e98342ffefdd FF, e84c15ea-f243-4fe9-8909-359971e2aa1c FS",

    },

    {
      "id": "2ee0aaa0-1c9e-4ce4-acf4-efe5f59b2491",
      "text": "Create co-packer labeling workflow SOP",
      "custom_tooltip": "<b>Create co-packer labeling workflow SOP</b><br>Document the end-to-end labeling process for the co-packer/shared kitchen, covering label printing/overprint approach, label attachment steps, required verification checks, and explicit reject/disposition criteria. Include process parameter/constraint notes (placement tolerance, readability requirements, adhesion checks if applicable) and define who performs each step and how records are captured.<br><b>Resources needed:</b><br><ul><li>Label Release &amp; Lot-Traceability Coordinator</li><li>Co-packer/shared kitchen documentation control/QA lead</li><li>Co-packer ops lead</li><li>Food labeling/compliance specialist (as reviewer)</li></ul>",
      "start_date": "2026-07-11",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "6843d221-0426-42b9-998e-bf3fc507f599 SS",

    },
    {
      "id": "0ab2fd8e-225c-426a-921d-cb032adf872e",
      "text": "Validate labeling attachment and overprint tolerances",
      "custom_tooltip": "<b>Validate labeling attachment and overprint tolerances</b><br>Run a short line capability/feasibility validation using representative labels and a pilot-like setup. Confirm practical limits for placement accuracy, overprint/print readability, adhesion/handling robustness, and any machine-specific failure modes. Produce an evidence report showing measured results against the defined tolerances and document any required process adjustments.<br><b>Resources needed:</b><br><ul><li>Co-packer/shared kitchen QA lead</li><li>Packaging technician/line operator</li><li>Label Release &amp; Lot-Traceability Coordinator</li><li>Instrumentation/tools for label readability/verification</li></ul>",
      "start_date": "2026-07-13",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "2ee0aaa0-1c9e-4ce4-acf4-efe5f59b2491 FS",
      "parent": "6843d221-0426-42b9-998e-bf3fc507f599"
    },
    {
      "id": "75393af3-5b29-4534-991a-04145c209ab9",
      "text": "Define label print ID verification rules",
      "custom_tooltip": "<b>Define label print ID verification rules</b><br>Specify the exact verification logic connecting each unit/lot to the correct label identifier (e.g., print/roll ID and artwork revision). Define acceptable evidence types (scanner, visual verification, batch/roll logs), reject triggers, escalation steps, and how discrepancies are recorded for later hold/release drill use.<br><b>Resources needed:</b><br><ul><li>Label Release &amp; Lot-Traceability Coordinator</li><li>Co-packer QA lead</li><li>Systems/IT support (if barcode/scan capture is used)</li><li>Documentation controller</li></ul>",
      "start_date": "2026-07-15",
      "duration": 2.0,
      "progress": 0,

    },
    {
      "id": "b75c239e-db89-4698-ae96-282fef495a02",
      "text": "Pilot label workflow dry-run with checklist",
      "custom_tooltip": "<b>Pilot label workflow dry-run with checklist</b><br>Execute a dry-run (paper/label simulation or minimal mock production) that completes the labeling workflow exactly as it will run in pilot. Use a standardized checklist to confirm every required record field is captured, that verification steps are executable under real timing, and that reject handling produces complete discrepancy documentation. Capture outcomes and finalize the SOP version for controlled use.<br><b>Resources needed:</b><br><ul><li>Co-packer/shared kitchen ops lead</li><li>Co-packer QA lead</li><li>Label Release &amp; Lot-Traceability Coordinator</li><li>Project manager (for coordination and sign-off)</li></ul>",

    {
      "id": "54ebbcd7-3426-4dd2-9e14-9a85e1948652",
      "text": "Pre-validate drill readiness inputs",
      "custom_tooltip": "<b>Pre-validate drill readiness inputs</b><br>Perform a paper dry run using a small subset of pilot records to confirm every required traceability identifier is available and consistent (supplier ingredient lots, COA references, roast/batch IDs, finished-goods lot IDs, pouch SKU, label/artwork revision, and label/print roll IDs). Identify gaps (missing lot identifiers, orphan mappings, incorrect revision fields) and resolve them (or log controlled exceptions) before executing the full drill so the drill does not stall mid-execution.<br><b>Resources needed:</b><br><ul><li>Label Release &amp; Lot-Traceability Coordinator</li><li>Co-packer/shared kitchen documentation control QA lead</li><li>Compliance/Labeling specialist</li><li>Data/ops analyst or traceability spreadsheet owner</li></ul>",

    {
      "id": "c75edcd0-b933-4bd2-95b5-ce9ef617384c",
      "text": "Execute traceability drill across SKUs",
      "custom_tooltip": "<b>Execute traceability drill across SKUs</b><br>Run the lot-to-label traceability drill across all 3 SKUs using the agreed number of drill lots per SKU. For each drilled unit (or batch of units), map supplier ingredient lots through formulation/roast/batch, finished-goods lot, pouch SKU, and the exact label/artwork revision and label roll/print ID attached to the unit. Capture evidence outputs (screenshots/printouts, label proof references, process logs) for auditability and verification.<br><b>Resources needed:</b><br><ul><li>Label Release &amp; Lot-Traceability Coordinator</li><li>Co-packer/shared kitchen ops/QA support</li><li>Documentation controller</li><li>Traceability drill runner(s)</li></ul>",

    {
      "id": "5672817b-c0d2-44a4-8cda-524c754d0211",
      "text": "Verify zero mismatch results",
      "custom_tooltip": "<b>Verify zero mismatch results</b><br>Conduct an internal verification pass against an acceptance checklist to confirm 0 label-attachment errors and 0 artwork-to-lot mismatches for 100% of drilled units. Validate that mappings are complete (no orphan lots, no missing revision/roll IDs), and reconcile any discrepancies immediately with the Label Release Owner via controlled correction steps before finalizing drill results.<br><b>Resources needed:</b><br><ul><li>QA / packaging lead</li><li>Label Release Owner</li><li>Compliance/labeling specialist</li><li>Co-packer QA lead</li></ul>",

    {
      "id": "a57aa12b-0694-4867-9b71-465b9e0b4c19",
      "text": "Report drill outcomes and evidence package",
      "custom_tooltip": "<b>Report drill outcomes and evidence package</b><br>Publish the drill results as a structured evidence package: drilled lots list, traceability mapping outputs, discrepancy log (pass/no-change-needed/contained exceptions), and supporting artifacts. Produce a concise summary dashboard that confirms drill success criteria (including zero mismatches) and forwards any required CAPA actions for preventing recurrence in future production and hold/release scenarios.<br><b>Resources needed:</b><br><ul><li>Project/milestone lead</li><li>Label Release &amp; Lot-Traceability Coordinator</li><li>Document controller</li><li>QA lead</li></ul>",

      "id": "7c10fe65-03e3-4d9d-bb6e-45c84717ad40",
      "text": "Design traceability data mapping model",
      "custom_tooltip": "<b>Design traceability data mapping model</b><br>Define the lot-to-label traceability data model for all 3 SKUs. Specify required fields and relationships that link: supplier ingredient lot/COA \u2192 roast/batch IDs \u2192 finished-goods lot \u2192 pouch SKU \u2192 label SKU/version \u2192 label roll/print ID \u2192 pack date \u2192 case/ship identifiers. Create a minimal required dataset for pilot drill success and publish a one-page mapping dictionary plus an example filled record.<br><b>Resources needed:</b><br><ul><li>Label Release Owner</li><li>QA/traceability coordinator</li><li>Co-packer documentation/QA lead</li><li>Data analyst (for templates and validation rules)</li></ul>",

    {
      "id": "0054282f-168b-4cc7-9171-caecc9797f02",
      "text": "Define label print and attachment workflow",
      "custom_tooltip": "<b>Define label print and attachment workflow</b><br>Document the co-packer/shared kitchen labeling workflow end-to-end, focusing on how label roll/print identifiers are captured and how attachment is verified. Define where and how overprint/print IDs are recorded, allowable tolerances, reject criteria, and the process for label changeover events (start/mid/end-of-run) so label/lot mismatches are detectable before shipment.<br><b>Resources needed:</b><br><ul><li>Co-packer/shared kitchen QA lead</li><li>Labeling/production operator representative</li><li>Label Release Owner</li><li>Food labeling/compliance advisor (for practical constraints)</li></ul>",

    {
      "id": "7b8080b4-ec27-4378-9cd9-9796698b8cdb",
      "text": "Run traceability drill across pilot lots",
      "custom_tooltip": "<b>Run traceability drill across pilot lots</b><br>Execute a lot-to-label traceability drill using pilot lots for all 3 SKUs. Use the traceability template to map each drilled unit from supplier COAs through finished-goods lots to the exact label SKU/version and label roll/print ID used. Perform a referential-integrity check (no orphan lots, no missing label revision mappings, no incorrect artwork/label attachments). Track discrepancies, apply controlled corrections, and rerun only affected units per a change-control rule.<br><b>Resources needed:</b><br><ul><li>Traceability drill coordinator</li><li>QA/labeling documentation support</li><li>Co-packer ops/records keeper</li><li>Second-person reviewer (for verification)</li></ul>",

    {
      "id": "838d65fa-6698-4d22-a54a-9985ff43211b",
      "text": "Assemble mock hold/release binder",
      "custom_tooltip": "<b>Assemble mock hold/release binder</b><br>Create a mock hold/release binder for the representative deviation scenarios expected during pilot. Include a contents list with named document owners, document index, and evidence retrieval SLAs targeting 24 hours. Binder sections should cover: quarantine scope rules, label/art proof references, supplier COAs/allergen evidence, batch/finished-goods records, label print/roll records, traceability mapping outputs, and CAPA ownership/response steps. Rehearse binder assembly once and run a timed evidence retrieval to confirm feasibility.<br><b>Resources needed:</b><br><ul><li>Food safety &amp; compliance lead</li><li>QA documentation control owner</li><li>Label Release &amp; lot-traceability coordinator</li><li>Co-packer documentation owner</li><li>Project/milestone lead</li></ul>",

    {
      "id": "4531c797-5c22-40dc-b163-4c221bec6dd0",
      "text": "Validate hold/release decision authority",
      "custom_tooltip": "<b>Validate hold/release decision authority</b><br>Confirm the governance workflow for labeling/traceability deviations: who can place product on hold, who can release, who approves CAPA/changes, and how quarantine scope is defined. Define escalation paths and decision criteria (including what triggers quarantine, how much is quarantined, and how disposition is documented). Run a tabletop simulation to ensure the team can respond within 24 hours with complete evidence and consistent disposition across scenarios.<br><b>Resources needed:</b><br><ul><li>Label Release Owner</li><li>QA lead</li><li>Food labeling/allergen compliance reviewer</li><li>Co-packer operations leader</li><li>Project/milestone lead</li></ul>",

      "text": "Prepare ingredient and allergen lists",
      "custom_tooltip": "<b>Prepare ingredient and allergen lists</b><br>Finalize ingredient statements and allergen/cross-contact declarations for all three SKUs. Confirm wording format, allergen emphasis, and any required cross-contact language based on supplier evidence; establish a no-build rule until lists match the master ingredient specs.<br><b>Resources needed:</b><br><ul><li>Food labeling and allergen compliance lead</li><li>Regulatory/labeling consultant (if applicable)</li><li>QA documentation owner</li><li>Supplier documentation coordinator</li></ul>",

      "text": "Build label master artwork set",
      "custom_tooltip": "<b>Build label master artwork set</b><br>Create and control the label master artwork package with version control, including SKU-level heat descriptor text, net quantity fields, lot/print fields, and all required regulatory statements. Run an ordered proofing workflow with compliance review and co-packer print/attachment feasibility checks before locking descriptors and final art versions.<br><b>Resources needed:</b><br><ul><li>Label release owner</li><li>Food labeling and allergen compliance lead</li><li>Design/packaging artwork specialist</li><li>Co-packer print/operations representative</li><li>QA documentation controller</li></ul>",

      "custom_tooltip": "<b>Design lot-to-label traceability model</b><br>Define the lot-to-label traceability data model linking supplier ingredient lots and COAs to roast/mix batches, finished-goods lots, pouch SKU, label SKU/version, and label roll/print identifiers. Create a mapping dictionary and a minimum required dataset for the pilot drill, aligned to what the co-packer can reliably capture on the floor.<br><b>Resources needed:</b><br><ul><li>Lot-traceability coordinator</li><li>Co-packer QA lead</li><li>Documentation control/QA lead</li><li>Data analyst or traceability modeler</li></ul>",

      "custom_tooltip": "<b>Run traceability drill and verify zero mismatches</b><br>Execute a lot-to-label traceability drill across all three SKUs using pilot lots (at least three drill lots total per SKU or maximum feasible). Validate that every drilled unit matches the correct label artwork revision/print identifier and lot code with no attachment or mapping errors; document evidence outputs for review.<br><b>Resources needed:</b><br><ul><li>Traceability drill coordinator</li><li>Co-packer labeling/ops support</li><li>QA inspector(s)</li><li>Label release owner</li></ul>",

      "text": "Assemble mock hold-release binder",
      "custom_tooltip": "<b>Assemble mock hold-release binder</b><br>Assemble the mock hold/release binder containing all required evidence artifacts, document owners, and retrieval SLAs (target retrieval/response within 24 hours). Pre-validate quarantine scope rules, decision authority (RACI), and CAPA ownership via a tabletop rehearsal for a representative labeling/traceability deviation scenario.<br><b>Resources needed:</b><br><ul><li>Food safety and compliance lead</li><li>QA documentation controller</li><li>Co-packer documentation control lead</li><li>Label release owner</li><li>CAPA owner or quality manager</li></ul>",

    {
      "id": "8904a9c8-f14a-4729-b11a-8b0d1b71d696",
      "text": "Define incident reason-code taxonomy",
      "custom_tooltip": "<b>Define incident reason-code taxonomy</b><br>Create a single, controlled incident/complaint reason-code taxonomy that covers likely early launch failure modes (leak/damage, reseal failure, heat descriptor mismatch, freshness/storage issues, labeling/lot traceability issues). For each reason code, specify the required evidence to verify (SKU/lot/pack date, seal integrity outcome, storage/handling context, temperature proxy if used, and traceability mapping fields) and the disposition decision-tree (accept, replace, quarantine, hold, investigate/CAPA trigger). Deliverables include a one-page taxonomy map, a decision-tree flow, and a reason-code-to-evidence checklist used by QA and DTC operations.<br><b>Resources needed:</b><br><ul><li>QA lead</li><li>Packaging/seal integrity specialist</li><li>Label/traceability coordinator</li><li>DTC customer experience lead</li><li>Compliance consultant (as needed)</li></ul>",
      "start_date": "2026-08-02",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "5fa4f561-f5bc-46f0-8b64-091156dcb504 SS",
      "parent": "5fa4f561-f5bc-46f0-8b64-091156dcb504"
    },
    {
      "id": "528083b3-264c-4fd1-bb89-797339574ebf",
      "text": "Map reason codes to evidence checks",
      "custom_tooltip": "<b>Map reason codes to evidence checks</b><br>Operationalize the taxonomy into a standardized triage workflow by mapping each reason code to the exact system and record sources required (label master fields, lot-to-label drill outputs, COAs, in-process seal test records, and packaging pilot dashboards). Define required form fields for incident intake, specify how to retrieve evidence within 24 hours, and create a quarantine scope trigger rule (which lots/percent bands are included and who can expand/restrict scope). Deliverables include a triage SOP draft, evidence retrieval checklist, and a quarantine/disposition rules reference.<br><b>Resources needed:</b><br><ul><li>Documentation control owner</li><li>Lot-to-label traceability coordinator</li><li>Co-packer/shared kitchen QA lead</li><li>QA analyst (for workflow mapping)</li><li>Project/milestone lead</li></ul>",

      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "8904a9c8-f14a-4729-b11a-8b0d1b71d696 FS",
      "parent": "5fa4f561-f5bc-46f0-8b64-091156dcb504"
    },
    {
      "id": "00ce42c6-2df6-4b41-8520-0d73b60802ce",
      "text": "Rehearse triage using binder drill scenario",
      "custom_tooltip": "<b>Rehearse triage using binder drill scenario</b><br>Run a tabletop rehearsal of at least one representative deviation scenario (e.g., detected seal integrity failure on a pilot unit or label attachment/roll ID discrepancy) using the mock hold/release binder. Time and document each step: incident intake \u2192 lot identification \u2192 evidence retrieval \u2192 quarantine decision \u2192 disposition recommendations \u2192 CAPA/escalation notes. Capture gaps (missing documents, unclear ownership, evidence not retrievable fast enough, unclear reason-code selection) and update the taxonomy, SOP, and binder instructions. Deliverables include drill run notes, timing metrics, gap list, and updated artifacts.<br><b>Resources needed:</b><br><ul><li>QA lead</li><li>Label release &amp; traceability coordinator</li><li>Mock hold/release binder custodian</li><li>Co-packer QA/ops representative</li><li>Project/milestone lead</li></ul>",

    {
      "id": "5f1c9143-2877-48e7-a509-aed8cc37acbd",
      "text": "Implement triage workflow and training",
      "custom_tooltip": "<b>Implement triage workflow and training</b><br>Deploy the finalized incident reason-code taxonomy and triage SOP to DTC support and QA personnel. Provide short training for how to select reason codes, what evidence must be attached to each incident record, and how to execute the decision-tree consistently. Set up the feedback intake guardrails (mandatory lot code/pack date fields, rate limiting/filters for structured QR intake) so noisy or low-quality claims do not corrupt descriptor/freshness governance decisions. Deliverables include training session materials, final triage SOP, incident intake form requirements, and a readiness sign-off checklist.<br><b>Resources needed:</b><br><ul><li>DTC customer experience lead</li><li>QA lead</li><li>Compliance/labeling reviewer (for critical points)</li><li>Process trainer or ops coordinator</li><li>Data/operations support (for form setup)</li></ul>",

      "custom_tooltip": "<b>Define SKU heat carrier specs</b><br>Document the dry-first heat/spice carrier approach for all three SKUs, including target compositions (spice blend targets), particle-size assumptions (if applicable), and the required mixing order-of-operations (weighing and adding sequence), plus any required rest/hold intervals and transfer timing assumptions from mixing to sealing.<br><b>Resources needed:</b><br><ul><li>Flavor Formulation &amp; Heat QA Lead</li><li>R&amp;D formulator</li><li>Packaging QA &amp; Reseal/Barrier Validation Specialist</li><li>Co-packer/shared kitchen blending lead</li></ul>",

    {
      "id": "c3edb5b1-d4f6-4895-b72f-b21dab005223",
      "text": "Translate specs into pilot-ready targets",
      "custom_tooltip": "<b>Translate specs into pilot-ready targets</b><br>Convert the written carrier/mixing approach into executable pilot parameters that the co-packer can run (e.g., batch size, measuring tolerances, addition order, maximum allowable mixing time variance, and required timing discipline). Produce a one-page per-SKU \u201cmixing execution targets\u201d sheet and a separate \u201cwhat triggers rework\u201d guide if parameters drift beyond windows.<br><b>Resources needed:</b><br><ul><li>Co-packer/shared kitchen blending lead</li><li>Flavor Formulation &amp; Heat QA Lead</li><li>QA documentation/control support</li><li>Project manager</li></ul>",
      "start_date": "2026-08-08",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "09963d0d-4dfc-45c5-bec7-0745122a4802 FS",
      "parent": "c2a3edfb-d57c-4769-9f33-f568ef6a4e2a"
    },
    {
      "id": "42d301cb-af9d-4dba-b643-4d84139ded76",
      "text": "Run pre-pilot mix verification",
      "custom_tooltip": "<b>Run pre-pilot mix verification</b><br>Execute a small number of pre-pilot mix runs for each SKU to confirm that the dry-first approach produces consistent distribution (no clumping/segregation), meets process constraints, and produces representative samples suitable for sensory testing. Record mixing logs and any deviations, then update the carrier specs or allowable windows based on results (change-controlled).<br><b>Resources needed:</b><br><ul><li>Co-packer/shared kitchen operators</li><li>QA/QC technician</li><li>Flavor Formulation &amp; Heat QA Lead</li><li>Sampling and labeling materials</li></ul>",
      "start_date": "2026-08-10",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "c3edb5b1-d4f6-4895-b72f-b21dab005223 FS",
      "parent": "c2a3edfb-d57c-4769-9f33-f568ef6a4e2a"
    },
    {
      "id": "e1d8a90a-f7cc-4164-b0a8-2ff73b0c0ba3",
      "text": "Lock mixing standard and freeze",
      "custom_tooltip": "<b>Lock mixing standard and freeze</b><br>Finalize and approve the mixing/order-of-operations and dry-first carrier specifications for all three SKUs under a change-control gate. Ensure the standard includes version-controlled documentation, the descriptor governance link (i.e., which evidence supports any heat descriptor positioning), and sign-off from heat QA and sensory rubric owners so the standard cannot be modified mid-pilot without documented justification.<br><b>Resources needed:</b><br><ul><li>Flavor Formulation &amp; Heat QA Lead</li><li>Sensory Science &amp; Consumer Testing Lead</li><li>QA/Documentation controller</li><li>Project owner / milestone decision authority</li></ul>",
      "start_date": "2026-08-12",
      "duration": 2.0,
      "progress": 0,
      "open": true,

      "parent": "c2a3edfb-d57c-4769-9f33-f568ef6a4e2a"
    },

      "text": "Standardize mixing time discipline and allowable process windows for heat consistency",
      "custom_tooltip": "<b>Standardize mixing time discipline and allowable process windows for heat consistency</b>",

    {
      "id": "cf9d9e57-3f9b-4a67-979e-fe73461f36f0",
      "text": "Define heat descriptor governance workflow",
      "custom_tooltip": "<b>Define heat descriptor governance workflow</b><br>Establish the end-to-end process for proposing, reviewing, and locking heat descriptor text across all 3 SKUs. Include: a single owner/Label Release Owner for descriptor decisions, required evidence inputs (sensory rubric results, packaging condition correlations, and lot-code linkage), decision levers (what can change vs what is frozen), and a version-control approach tied to the label master revision cycle. Output should include a documented RACI and change-control rules so descriptor edits cannot occur during throughput spikes without compliance and sensory sign-off.<br><b>Resources needed:</b><br><ul><li>Food labeling/compliance lead</li><li>Heat QA or sensory science lead</li><li>Label Release Owner</li><li>QA lead</li><li>Project manager</li></ul>",
      "start_date": "2026-08-14",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "de5254c0-ca2c-43a1-91fb-984e956e8ae8 SS",
      "parent": "de5254c0-ca2c-43a1-91fb-984e956e8ae8"
    },
    {
      "id": "b69bb9f1-d64a-4a20-b9ec-72364f9003ac",
      "text": "Lock descriptor set and freeze dates",
      "custom_tooltip": "<b>Lock descriptor set and freeze dates</b><br>Select the initial descriptor set for each heat level/category and map each descriptor to governance-approved sensory evidence requirements. Define freeze dates relative to pilot execution milestones (e.g., before any pilot sensory scoring used for release minimums). Create a descriptor version registry that links: descriptor text version, SKU, effective date, and the minimum evidence set needed to support any subsequent updates. Deliverable is a signed-off descriptor registry used for the pilot and subsequent label master proofs.<br><b>Resources needed:</b><br><ul><li>Label Release Owner</li><li>Sensory science lead</li><li>QA/Heat QA lead</li><li>Compliance reviewer</li><li>Document controller</li></ul>",
      "start_date": "2026-08-15",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "cf9d9e57-3f9b-4a67-979e-fe73461f36f0 FS",
      "parent": "de5254c0-ca2c-43a1-91fb-984e956e8ae8"
    },
    {
      "id": "7bb46c99-fc0a-4832-bdf0-682e359825d9",
      "text": "Build descriptor evidence-to-lot template",
      "custom_tooltip": "<b>Build descriptor evidence-to-lot template</b><br>Create the evidence template that ensures every descriptor in use is supported by lot-level sensory outcomes. The template must require: SKU, lot code, sampling timepoint (T0 and minimum-quality proxy timepoint), sensory panel scores/ratings, descriptor version ID used, and an automated/checkbox readiness status (pass/fail). Add validation rules to prevent records with missing lot codes, mismatched descriptor versions, or incomplete timepoint evidence from being accepted into the governance workflow.<br><b>Resources needed:</b><br><ul><li>QA analyst or data owner</li><li>Sensory science lead</li><li>Label Release Owner</li><li>Spreadsheet/database support</li><li>Co-packer documentation liaison</li></ul>",
      "start_date": "2026-08-16",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "b69bb9f1-d64a-4a20-b9ec-72364f9003ac FS",
      "parent": "de5254c0-ca2c-43a1-91fb-984e956e8ae8"
    },
    {
      "id": "2b2adccf-3cb0-4df9-822f-435255d9aecb",
      "text": "Run controlled descriptor update scenarios",
      "custom_tooltip": "<b>Run controlled descriptor update scenarios</b><br>Stress-test the governance workflow with tabletop scenarios (e.g., out-of-range intensity on one lot, conflicting panel results between timepoints, or a late descriptor edit request). For each scenario, document: who must approve, what evidence is required, how quickly the evidence is assembled, and what the approved disposition is (reject edit, update with re-justification, or keep current descriptor). Include a compliance sanity check to ensure language remains conservative and defensible.<br><b>Resources needed:</b><br><ul><li>Label Release Owner</li><li>Compliance reviewer</li><li>Sensory science lead</li><li>QA lead</li><li>Project manager</li></ul>",
      "start_date": "2026-08-17",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "7bb46c99-fc0a-4832-bdf0-682e359825d9 FS",
      "parent": "de5254c0-ca2c-43a1-91fb-984e956e8ae8"
    },
    {
      "id": "a21d9920-d803-40f7-93e9-47175f8c3dbe",
      "text": "Confirm label master descriptor lock audit",
      "custom_tooltip": "<b>Confirm label master descriptor lock audit</b><br>Perform a final audit that the descriptor versions used in pilot labeling/print proofs match the locked governance registry. Verify: label master revision IDs, heat descriptor text for each SKU, effective dates, and alignment to the evidence template requirements. Deliver a short audit report with pass/fail status and a list of any corrective actions required before distribution and pilot use.<br><b>Resources needed:</b><br><ul><li>Label Release Owner</li><li>Document controller</li><li>Compliance reviewer (or delegate)</li><li>QA lead</li><li>Co-packer label proof contact</li></ul>",
      "start_date": "2026-08-18",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "de5254c0-ca2c-43a1-91fb-984e956e8ae8 FF, 2b2adccf-3cb0-4df9-822f-435255d9aecb FS",
      "parent": "de5254c0-ca2c-43a1-91fb-984e956e8ae8"
    },

      "id": "2d05c58f-3ad0-4f5f-8c6e-34932820b618",
      "text": "Define heat descriptors, heat scale levels, and governance rules for descriptor updates",

    {
      "id": "fee2ab51-95e8-4b3b-9679-174ebcb6d5d8",
      "text": "Define DTC carton and cushioning BOM",
      "custom_tooltip": "<b>Define DTC carton and cushioning BOM</b><br>Select the DTC shipper/case, cushioning/void fill, insulation approach (if used), and orientation/pack layout based on the validated pouch outer dimensions. Create a frozen BOM with alternates, supplier part numbers, and assembly instructions. Confirm lot/pack date placement and readability requirements on shipped units.<br><b>Resources needed:</b><br><ul><li>DTC fulfillment lead</li><li>Packaging engineer or packaging QA specialist</li><li>Procurement support</li><li>Operations/co-packer packaging technician</li><li>QA documentation owner</li></ul>",
      "start_date": "2026-08-19",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "2d05c58f-3ad0-4f5f-8c6e-34932820b618 SS",
      "parent": "2d05c58f-3ad0-4f5f-8c6e-34932820b618"
    },
    {
      "id": "f2c08fe7-5104-4ddb-bc6a-65ad8d929356",
      "text": "Build pick/pack QC checklist with controls",
      "custom_tooltip": "<b>Build pick/pack QC checklist with controls</b><br>Create pick/pack QC checklists and error-proofing steps tied to lot/label and SKU identity (e.g., scanner/verification rules, label roll/print ID capture, staging separation for wrong-lot prevention). Include acceptance/rejection criteria, reason-code mapping hooks, and a quick training guide for packers.<br><b>Resources needed:</b><br><ul><li>DTC operations specialist</li><li>QA/QC lead</li><li>Co-packer line supervisor</li><li>Label/traceability coordinator</li><li>Training coordinator</li></ul>",
      "start_date": "2026-08-21",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "fee2ab51-95e8-4b3b-9679-174ebcb6d5d8 FS",
      "parent": "2d05c58f-3ad0-4f5f-8c6e-34932820b618"
    },
    {
      "id": "09b1e0b0-5ac6-4e45-9427-c053ef4d98e0",
      "text": "Run shipping abuse simulations matrix",
      "custom_tooltip": "<b>Run shipping abuse simulations matrix</b><br>Execute a worst-case transit/handling simulation plan aligned to the CT/RI usage assumptions (warm ambient storage, jostle/vibration, stacking, and time-on-booth staging). Define scenario set, environmental setpoints, stabilization periods, sample size/replicates, test fixtures, and the defect observation taxonomy. Log conditions and results in a standardized template.<br><b>Resources needed:</b><br><ul><li>Shipping test lead</li><li>Packaging/QA specialist</li><li>Test equipment operator (vibration/impact and/or environmental chamber)</li><li>Lab technician or data analyst</li><li>DTC fulfillment representative</li></ul>",
      "start_date": "2026-08-23",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "f2c08fe7-5104-4ddb-bc6a-65ad8d929356 FS",
      "parent": "2d05c58f-3ad0-4f5f-8c6e-34932820b618"
    },
    {
      "id": "67efc0f1-842e-455c-a56c-8dcec504c026",
      "text": "Quantify damage and incidents by scenario",
      "custom_tooltip": "<b>Quantify damage and incidents by scenario</b><br>Analyze simulation outcomes to compute damage/defect rates by SKU and scenario, map observed defects to reason-code categories (leak/damage vs heat-mismatch vs freshness/storage), and compare against the pilot stop/go targets. Produce a scenario comparison dashboard showing sensitivity to packaging configuration and orientation rules.<br><b>Resources needed:</b><br><ul><li>Data analyst</li><li>QA lead</li><li>Packaging engineer/consultant</li><li>DTC fulfillment lead</li></ul>",
      "start_date": "2026-08-25",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "09b1e0b0-5ac6-4e45-9427-c053ef4d98e0 FS",
      "parent": "2d05c58f-3ad0-4f5f-8c6e-34932820b618"
    },
    {
      "id": "3cc55be8-8f43-40c1-820b-fe5c96dfcd57",
      "text": "Set go/no-go shipping cutoffs",
      "custom_tooltip": "<b>Set go/no-go shipping cutoffs</b><br>Use the validated packaging performance plus roast-to-pack eligibility and defect-rate targets to define and freeze the DTC shipping cutoff policy (cutoff timing, allowed transit/storage assumptions, and any escalation rules). Run a final crosswalk that ensures the cutoff and packing SOPs are consistent with packaging stop/go criteria; document decision and fallback actions.<br><b>Resources needed:</b><br><ul><li>DTC operations specialist</li><li>Packaging QA specialist</li><li>Project/milestone lead</li><li>Flavor/heat QA lead (for heat-mismatch linkage)</li><li>Compliance/labeling coordinator (for any packaging labeling changes)</li></ul>",
      "start_date": "2026-08-27",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "2d05c58f-3ad0-4f5f-8c6e-34932820b618 FF, 67efc0f1-842e-455c-a56c-8dcec504c026 FS",
      "parent": "2d05c58f-3ad0-4f5f-8c6e-34932820b618"
    },
    {
      "id": "fcdcabbd-b57a-4383-92bb-0ad474e364a5",
      "text": "Develop sensory panel protocol and rubric (onset, intensity, aroma persistence, afterburn) with training/calibration",
      "custom_tooltip": "<b>Develop sensory panel protocol and rubric (onset, intensity, aroma persistence, afterburn) with training/calibration</b>",
      "progress": 0,
      "open": true,
      "meta": "2d05c58f-3ad0-4f5f-8c6e-34932820b618 FS",
      "parent": "0f8600a4-55b8-493d-af22-0e5505567d31",
      "type": "project"
    },
    {
      "id": "db38fdd4-7a10-4b49-acdc-2834a71ca67c",
      "text": "Define heat descriptors and levels",
      "custom_tooltip": "<b>Define heat descriptors and levels</b><br>Establish the SKU-specific heat descriptor set (including scale level text), definitions for each level (onset, intensity, afterburn), and what claim text is permitted/forbidden. Produce a descriptor glossary and link each descriptor level to the expected sensory outcomes and governance decision levers.<br><b>Resources needed:</b><br><ul><li>Flavor formulation and heat QA lead</li><li>Sensory science lead</li><li>Labeling and allergen compliance specialist</li><li>Project milestone lead</li></ul>",
      "start_date": "2026-08-29",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "fcdcabbd-b57a-4383-92bb-0ad474e364a5 SS",
      "parent": "fcdcabbd-b57a-4383-92bb-0ad474e364a5"
    },
    {
      "id": "700dbb07-7b29-4df1-9a4d-34516aef38fa",
      "text": "Set governance workflow and ownership",
      "custom_tooltip": "<b>Set governance workflow and ownership</b><br>Define a single-owner descriptor governance process: who can propose changes, what evidence is required, how approvals are captured, and the version-control mechanism tying descriptor versions to label master revisions. Create a change-control form and lock dates/trigger points based on pilot milestones.<br><b>Resources needed:</b><br><ul><li>Project manager</li><li>Label release owner</li><li>Compliance reviewer</li><li>QA lead</li></ul>",
      "start_date": "2026-08-31",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "db38fdd4-7a10-4b49-acdc-2834a71ca67c FS",
      "parent": "fcdcabbd-b57a-4383-92bb-0ad474e364a5"
    },
    {
      "id": "5aeb858f-ae1a-4852-a5ae-07cad823e3ba",
      "text": "Create evidence requirements by SKU",
      "custom_tooltip": "<b>Create evidence requirements by SKU</b><br>Specify the minimum evidence needed to justify descriptor selection/updates: required sensory timepoints (T0 and minimum-quality proxy), required sample/lot inclusion rules, acceptable score ranges, panel calibration requirements, and how packaging condition evidence feeds heat descriptor decisions. Output an evidence checklist used in pilot batch reviews.<br><b>Resources needed:</b><br><ul><li>Heat QA lead</li><li>Sensory panel coordinator</li><li>Packaging QA representative</li><li>Compliance reviewer</li></ul>",
      "start_date": "2026-09-02",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "700dbb07-7b29-4df1-9a4d-34516aef38fa FS",
      "parent": "fcdcabbd-b57a-4383-92bb-0ad474e364a5"
    },
    {
      "id": "7f70230b-3afd-43e1-9bfb-c493143d6973",
      "text": "Validate descriptor mapping with pilot data",
      "custom_tooltip": "<b>Validate descriptor mapping with pilot data</b><br>Run pilot sensory evaluations and map results to descriptor levels using the agreed rubric and timepoints. Confirm descriptor accuracy KPI thresholds per SKU, resolve any mismatches using the governance workflow, and document descriptor version decisions with traceable lot evidence.<br><b>Resources needed:</b><br><ul><li>Sensory science lead</li><li>Heat QA lead</li><li>Data analyst</li><li>Packaging QA representative</li></ul>",
      "start_date": "2026-09-04",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "5aeb858f-ae1a-4852-a5ae-07cad823e3ba FS",
      "parent": "fcdcabbd-b57a-4383-92bb-0ad474e364a5"
    },
    {
      "id": "9350af1a-58c4-43d0-8023-56bb5b246107",
      "text": "Lock descriptor versions in label master",
      "custom_tooltip": "<b>Lock descriptor versions in label master</b><br>After governance compliance checks, freeze descriptor versions and ensure they are correctly reflected in the label master control system. Perform an artwork-to-governance audit (descriptor version ID and effective lot/label fields) and coordinate any final label-proof updates through the label release process.<br><b>Resources needed:</b><br><ul><li>Label release and lot-traceability coordinator</li><li>Labeling and allergen compliance specialist</li><li>Co-packer documentation/QA representative</li><li>Project milestone lead</li></ul>",
      "start_date": "2026-09-06",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "fcdcabbd-b57a-4383-92bb-0ad474e364a5 FF, 7f70230b-3afd-43e1-9bfb-c493143d6973 FS",
      "parent": "fcdcabbd-b57a-4383-92bb-0ad474e364a5"
    },
    {
      "id": "c49564a1-82db-4e2d-939a-291258b72676",
      "text": "Run sensory evaluations at T0 and at a minimum-quality timepoint proxy for all 3 SKUs/production runs",
      "custom_tooltip": "<b>Run sensory evaluations at T0 and at a minimum-quality timepoint proxy for all 3 SKUs/production runs</b>",
      "progress": 0,
      "open": true,
      "meta": "fcdcabbd-b57a-4383-92bb-0ad474e364a5 FS",
      "parent": "0f8600a4-55b8-493d-af22-0e5505567d31",
      "type": "project"
    },
    {
      "id": "2254e879-73f8-4f64-a173-2f702f1d1e5b",
      "text": "Define sampling and storage SOP",
      "custom_tooltip": "<b>Define sampling and storage SOP</b><br>Define exactly how finished-goods samples for sensory testing will be collected, labeled, transported, and stored so T0 and the minimum-quality timepoint are comparable across all 3 SKUs and all production runs. Include: sample pull timing relative to pack time, sample container/cover requirements to prevent heat/aroma loss, storage temperature/time windows, handling and blinding rules, chain-of-custody fields, and exceptions when a run misses the planned schedule. Deliverables include a signed SOP and a sample tracking sheet template with lot code linkage.<br><b>Resources needed:</b><br><ul><li>Sensory science lead</li><li>QA/food safety lead</li><li>Co-packer/shared kitchen QA or production coordinator</li><li>Project manager</li></ul>",
      "start_date": "2026-09-08",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "c49564a1-82db-4e2d-939a-291258b72676 SS",
      "parent": "c49564a1-82db-4e2d-939a-291258b72676"
    },
    {
      "id": "dbdbf2af-bce0-418b-9588-4347b13ff5c7",
      "text": "Finalize T0 and timepoint protocol",
      "custom_tooltip": "<b>Finalize T0 and timepoint protocol</b><br>Specify the sensory evaluation schedule and protocol for each SKU that defines the two required evaluation points: T0 (packaging time) and the minimum-quality timepoint proxy (worst-case handling aligned). For each timepoint, document: serving preparation (portion size, temperature, serving order), presentation/blinding method, panel environment conditions, scoring sheets, reference/anchor samples for heat descriptor levels, and how deviations are handled. Deliverables include a run schedule and per-timepoint work instructions for panelists and coordinators.<br><b>Resources needed:</b><br><ul><li>Sensory science lead</li><li>Flavor/heat QA specialist</li><li>Panel coordinator</li><li>QA lead</li></ul>",
      "start_date": "2026-09-09",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "2254e879-73f8-4f64-a173-2f702f1d1e5b FS",
      "parent": "c49564a1-82db-4e2d-939a-291258b72676"
    },
    {
      "id": "5a99cf12-4589-4302-abe4-8415f326980e",
      "text": "Conduct sensory sessions for all runs",
      "custom_tooltip": "<b>Conduct sensory sessions for all runs</b><br>Run the sensory evaluations at T0 and at the minimum-quality timepoint proxy for all 3 SKUs across the planned pilot production runs. Ensure execution quality by tracking adherence to the SOP, confirming correct lot code and descriptor version, and verifying that samples remain within approved storage/handling windows. Capture panelist scores, comments, and any observed anomalies. Deliverables include completed raw sensory score data, deviation logs, and a summary report per SKU/timepoint.<br><b>Resources needed:</b><br><ul><li>Sensory panelists</li><li>Sensory science lead</li><li>Panel coordinator</li><li>Co-packer/shared kitchen liaison</li></ul>",
      "start_date": "2026-09-10",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "dbdbf2af-bce0-418b-9588-4347b13ff5c7 FS",
      "parent": "c49564a1-82db-4e2d-939a-291258b72676"
    },
    {
      "id": "c12d256e-a1ca-4cf7-b697-b83a8cb7e222",
      "text": "Link sensory results to lot codes",
      "custom_tooltip": "<b>Link sensory results to lot codes</b><br>Create and maintain the controlled heat evidence dataset that links every sensory result back to its specific SKU, finished-goods lot code, descriptor version, and the exact evaluation timepoint (T0 vs minimum-quality proxy). Validate referential integrity (no orphan lots, no missing descriptor/version fields) and confirm that data entry matches the official sampling record. Deliverables include a completed heat claims + lot evidence matrix and an audit checklist showing that each required field is populated.<br><b>Resources needed:</b><br><ul><li>Sensory data analyst (or QA data lead)</li><li>QA lead</li><li>Label/release data owner</li><li>Spreadsheet/data tooling support</li></ul>",
      "start_date": "2026-09-11",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "5a99cf12-4589-4302-abe4-8415f326980e FS",
      "parent": "c49564a1-82db-4e2d-939a-291258b72676"
    },
    {
      "id": "a5f7d29d-6b60-449f-bc12-0d2520b81ec6",
      "text": "Update heat descriptor governance outputs",
      "custom_tooltip": "<b>Update heat descriptor governance outputs</b><br>Use the collected sensory evidence to support the heat descriptor governance process: check whether the descriptor levels used for each run are supported by panel outcomes at both required timepoints, identify any need for descriptor refinement, and produce the evidence package required for governance sign-off. Include a pass/fail recommendation against the predefined sensory release minimums and document any proposed changes via the approved change-control path. Deliverables include governance decision notes, recommended descriptor updates (if any), and a final per-SKU release-minimums evidence summary.<br><b>Resources needed:</b><br><ul><li>Flavor/heat QA specialist</li><li>Sensory science lead</li><li>Regulatory/label compliance lead (claims review)</li><li>Project manager</li></ul>",

    {
      "id": "daeb73df-86d5-4bdd-ac3c-aa211e168fea",
      "text": "Secure allergen and ingredient inputs",
      "custom_tooltip": "<b>Secure allergen and ingredient inputs</b><br>Collect final ingredient statements for all 3 SKUs and validate allergen/cross-contact declarations are complete and supplier-evidenced. Produce SKU-by-SKU allergen declaration text drafts plus a list of any missing or disputed supplier statements to resolve before artwork/proofing.<br><b>Resources needed:</b><br><ul><li>Food labeling and allergen compliance lead</li><li>Supplier documentation coordinator</li><li>QA lead</li><li>Label release reviewer/consultant</li></ul>",
