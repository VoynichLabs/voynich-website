    {
      "id": "5a4f1c31-6901-4f78-9795-826832693e7d",
      "text": "Build label master with controlled fields",
      "custom_tooltip": "<b>Build label master with controlled fields</b><br>Create the controlled label master artwork set for all 3 SKUs using a version-controlled template that includes: ingredient and allergen formatting, net quantity, manufacturer/distributor fields, SKU identifiers, heat descriptor governance fields, and the lot/traceability fields required for lot-to-label mapping.<br><b>Resources needed:</b><br><ul><li>Graphic designer or labeling artwork specialist</li><li>Food labeling and allergen compliance lead</li><li>Label Release Owner</li><li>Document control/QA support</li></ul>",

    {
      "id": "b043a4c0-ddd3-4144-ad89-a995dab39f80",
      "text": "Define lot-to-label and print workflow",
      "custom_tooltip": "<b>Define lot-to-label and print workflow</b><br>Document the co-packer/shared kitchen labeling workflow end-to-end: how label print identifiers/roll IDs are generated, how overprinting and attachment are verified, where lot code/pack date appear, and what rejection/disposition rules apply if verification fails. Deliver an SOP plus a data capture template for traceability inputs.<br><b>Resources needed:</b><br><ul><li>Co-packer/shared kitchen operations QA lead</li><li>Labeling workflow owner</li><li>QA/documentation control support</li><li>Co-packer label tech/operator</li></ul>",

    {
      "id": "3a8dd982-ba68-47f8-9187-8753bb6e133a",
      "text": "Run traceability drill and evidence drill",
      "custom_tooltip": "<b>Run traceability drill and evidence drill</b><br>Execute a lot-to-label traceability drill across all 3 SKUs using pilot lots to confirm correct artwork revision/label attachment for every drilled unit. Assemble the mock hold/release binder for the representative deviation scenario and rehearse evidence retrieval to demonstrate the 24-hour SLA and completeness of the response workflow.<br><b>Resources needed:</b><br><ul><li>Lot-to-label traceability coordinator</li><li>Co-packer/shared kitchen QA/documentation lead</li><li>Food labeling and allergen compliance specialist</li><li>Project lead (drill facilitator)</li></ul>",

    {
      "id": "4fd7428e-eda8-41bd-8603-3dcfe2aadda0",
      "text": "Obtain expert sign-off and lock versions",
      "custom_tooltip": "<b>Obtain expert sign-off and lock versions</b><br>Perform internal pre-checks for compliance completeness (allergen formatting, required fields, heat descriptor/label consistency, and zero mismatches for drilled units). Submit the package for labeling/compliance expert sign-off and then lock label master versions and descriptor versions with change-control rules for any post-sign-off updates.<br><b>Resources needed:</b><br><ul><li>Food labeling and allergen compliance specialist</li><li>Label Release Owner</li><li>QA lead</li><li>Project lead for go/no-go</li></ul>",

    {
      "id": "a1689be9-dc3c-40c8-8212-692ef9558cbc",
      "text": "Dry-first mixing order specifications",
      "custom_tooltip": "<b>Dry-first mixing order specifications</b><br>Define SKU-level heat/spice carrier approach and translate dry-first strategy into executable mixing order-of-operations (weighing/adding sequence, rest/hold timing, transfer timing, and post-mix-to-seal expectations). Deliverables include a per-SKU written spec and an execution checklist for the co-packer/shared kitchen so pilot batches follow the same steps.<br><b>Resources needed:</b><br><ul><li>Flavor formulation lead</li><li>Heat QA specialist</li><li>Co-packer/shared kitchen lead</li><li>QA documentation owner</li></ul>",

    {
      "id": "270d2814-00af-4cf9-b9f2-9f455d8970c3",
      "text": "Heat mixing time windows",
      "custom_tooltip": "<b>Heat mixing time windows</b><br>Set measurable mixing time discipline and allowable process windows for heat consistency (start/stop timing rules, variance tolerances, documentation fields, and required responses to deviations). Include a quick training/first-article verification step to confirm operators can hit targets on the real equipment.<br><b>Resources needed:</b><br><ul><li>Process engineer or production supervisor</li><li>Heat QA specialist</li><li>Co-packer/shared kitchen operators</li><li>QA recordkeeper</li></ul>",

      "duration": 2.0,

    },
    {
      "id": "bc48466d-1308-4339-aeca-60cde0d90fbf",
      "text": "Heat descriptor governance workflow",
      "custom_tooltip": "<b>Heat descriptor governance workflow</b><br>Create a descriptor governance system that locks heat descriptor versions based on evidence. Define the heat level taxonomy, which descriptors map to which sensory outcomes, who can request/approve changes, what evidence is required, and the effective-date/freeze rules that prevent late uncontrolled edits.<br><b>Resources needed:</b><br><ul><li>Food labeling/compliance lead</li><li>Flavor formulation lead</li><li>Project owner/QA lead</li><li>Document control owner</li></ul>",
      "start_date": "2026-09-22",
      "duration": 2.0,

    },
    {
      "id": "3db2d0b1-c656-43b7-bb7c-2fecccae52c1",
      "text": "Sensory rubric design and calibration",
      "custom_tooltip": "<b>Sensory rubric design and calibration</b><br>Develop the sensory panel protocol and scoring rubric (onset, intensity, aroma persistence, afterburn) with definitions and reference anchors per heat level. Run panel training/calibration to confirm scoring repeatability, and finalize the data capture form linked to SKU and lot codes.<br><b>Resources needed:</b><br><ul><li>Sensory science lead</li><li>Flavor/heat specialist</li><li>Trained tasting panelists</li><li>Data capture/QA coordinator</li></ul>",

    {
      "id": "cb52f3e2-c4f4-4d41-9db4-7a05ca73de16",
      "text": "Run sensory at T0 and QTP",
      "custom_tooltip": "<b>Run sensory at T0 and QTP</b><br>Execute sensory evaluations for all 3 SKUs at T0 and a minimum-quality timepoint proxy aligned to worst-case conditions. Standardize sample handling/storage, ensure consistent descriptor version usage, capture results with lot codes, and produce a heat claims + lot evidence matrix ready for downstream release minimums checks.<br><b>Resources needed:</b><br><ul><li>Sensory science lead</li><li>Panelists</li><li>QA sampling coordinator</li><li>Co-packer/shared kitchen team</li><li>Data analyst</li></ul>",

    {
      "id": "35188dcc-b562-4ace-9c51-2b96c71b6734",
      "text": "Define minimum-quality timepoint proxy",
      "custom_tooltip": "<b>Define minimum-quality timepoint proxy</b><br>Select and document the minimum-quality timepoint (real-time or accelerated proxy) that corresponds to worst-case customer experience, including sampling timing relative to roast/pack, storage/handling assumptions, and acceptance relevance. Produce an SOP for how/when samples are pulled, stored, and served for sensory scoring to ensure comparability across runs.<br><b>Resources needed:</b><br><ul><li>Flavor formulation &amp; heat QA lead</li><li>Sensory science &amp; consumer testing lead</li><li>Packaging QA &amp; reseal validation specialist</li><li>Co-packer/shared kitchen QA contact</li><li>Project milestone lead</li></ul>",
      "start_date": "2026-09-28",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "2946dfc5-7afc-4664-aa07-28612b0af1de SS",

    },
    {
      "id": "93cd979b-851f-40b4-8cd2-dccdf5c14017",
      "text": "Execute T0 and timepoint sensory",
      "custom_tooltip": "<b>Execute T0 and timepoint sensory</b><br>Run sensory evaluations for all 3 SKUs at both T0 (pack time) and the minimum-quality timepoint proxy. Standardize serving protocol, panel conditions, sample handling, and documentation so every evaluated unit is traceable to SKU, lot code, and descriptor version. Capture onset/intensity/aroma persistence/afterburn scores and any deviations in process or sample condition.<br><b>Resources needed:</b><br><ul><li>Sensory panelists</li><li>Sensory lead and coordinator</li><li>Co-packer/shared kitchen for sample pull</li><li>Data capture/QA recorder</li><li>Flavor formulation &amp; heat QA lead</li></ul>",
      "start_date": "2026-09-29",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "35188dcc-b562-4ace-9c51-2b96c71b6734 FS",
      "parent": "2946dfc5-7afc-4664-aa07-28612b0af1de"
    },
    {
      "id": "9a2a81b8-ab2c-4fdb-b6f6-6f94c3b6349a",
      "text": "Create heat claims evidence matrix",
      "custom_tooltip": "<b>Create heat claims evidence matrix</b><br>Build a heat claims + lot evidence matrix that links each finished-goods lot to: descriptor version used on-pack, days-since-roast/hold conditions, T0 scores, minimum-quality timepoint scores, and the governance decision outcome. Validate referential integrity (no orphan lots, no missing descriptor/lot mapping) and prepare a dashboard view for release minimums readiness.<br><b>Resources needed:</b><br><ul><li>Heat QA lead</li><li>Sensory science lead</li><li>QA/traceability coordinator</li><li>Data analyst (spreadsheet/Python or equivalent)</li><li>Label governance owner</li></ul>",
      "start_date": "2026-09-30",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "93cd979b-851f-40b4-8cd2-dccdf5c14017 FS",
      "parent": "2946dfc5-7afc-4664-aa07-28612b0af1de"
    },
    {
      "id": "94158241-2c7b-4563-befd-69b8c84a1361",
      "text": "Validate descriptor accuracy KPI",
      "custom_tooltip": "<b>Validate descriptor accuracy KPI</b><br>Define and calculate the descriptor accuracy KPI (e.g., % of respondents matching label/QR level within one category) using the structured QR/intake or panel mapping method. Perform at least two consecutive production-run confirmations per SKU, apply governance filters to exclude low-quality/invalid feedback, and verify the KPI is consistent across channels and lot ages per the project criteria.<br><b>Resources needed:</b><br><ul><li>Sensory science &amp; consumer testing lead</li><li>Heat QA lead</li><li>Data analyst</li><li>Food labeling/compliance lead (claims defensibility check)</li><li>Panel coordinator</li></ul>",
      "start_date": "2026-10-01",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "9a2a81b8-ab2c-4fdb-b6f6-6f94c3b6349a FS",
      "parent": "2946dfc5-7afc-4664-aa07-28612b0af1de"
    },
    {
      "id": "412dd4ba-9a60-4f6a-affd-58d0ede8f09c",
      "text": "Lock descriptor versions after checks",
      "custom_tooltip": "<b>Lock descriptor versions after checks</b><br>Enforce a formal descriptor lock gate: confirm every descriptor version used in the pilot runs is supported by sensory evidence at both T0 and the minimum-quality timepoint, confirm governance compliance (no unsupported edits), and update the label master version/effective dates accordingly. Publish the locked descriptor set and the rationale/evidence index for audit readiness.<br><b>Resources needed:</b><br><ul><li>Label release &amp; lot-traceability coordinator</li><li>Food labeling/compliance lead</li><li>Sensory science lead</li><li>Heat QA lead</li><li>Project milestone lead</li></ul>",
      "start_date": "2026-10-02",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "2946dfc5-7afc-4664-aa07-28612b0af1de FF, 94158241-2c7b-4563-befd-69b8c84a1361 FS",

    },

      "text": "Qualify nut suppliers (two vetted suppliers per nut type) and collect required COAs/spec documentation",

      "meta": "a07c24ee-4d19-435f-bb91-c5b1b75230ed SS",

    {
      "id": "7300dc3b-e44e-4e2e-80b9-a80a908b7ba2",
      "text": "Qualify nut suppliers and COAs",
      "custom_tooltip": "<b>Qualify nut suppliers and COAs</b><br>Qualify at least two vetted nut suppliers per nut type, define acceptance criteria for supplier quality/documentation, and collect required COAs/spec evidence that supports ingredient release and traceability into pilot production. Steps: (1) create a supplier qualification checklist (quality, allergen/cross-contact evidence, traceability fields, effective dates); (2) confirm backup supplier coverage per nut type; (3) obtain COAs and confirm required metrics and identifiers; (4) validate that evidence completeness meets the \u201cno-build\u201d threshold for label master work. Deliverables: approved supplier list, qualification matrix, and a COA/evidence repository indexed by nut type and supplier.<br><b>Resources needed:</b><br><ul><li>Supply chain/procurement lead</li><li>Quality specialist</li><li>Food safety/HACCP coordinator</li><li>Allergen compliance consultant or specialist</li><li>Document control owner</li></ul>",
      "start_date": "2026-10-03",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "2fc11abe-f2e1-4536-a38e-2db5342eaa0a SS",
      "parent": "2fc11abe-f2e1-4536-a38e-2db5342eaa0a"
    },
    {
      "id": "a1ddc604-28ff-4dce-b767-4ba8ac9b041f",
      "text": "Collect allergen and cross-contact evidence",
      "custom_tooltip": "<b>Collect allergen and cross-contact evidence</b><br>Gather and verify supplier allergen/cross-contact documentation needed for each SKU\u2019s label master and for cross-contact defensibility (e.g., shared equipment statements, cleaning/sanitation controls, allergen management program summaries where applicable). Steps: (1) standardize required allergen statement formats; (2) request supplier cross-contact evidence aligned to your SKU ingredient list; (3) review consistency across COAs and supporting letters; (4) record evidence effective dates and any change/version notes; (5) flag gaps for immediate resolution. Deliverables: SKU-by-SKU allergen/cross-contact evidence file set with documented approval readiness status.<br><b>Resources needed:</b><br><ul><li>Allergen compliance lead/specialist</li><li>Procurement lead</li><li>QA documentation reviewer</li><li>Supplier quality contacts</li></ul>",
      "start_date": "2026-10-05",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "7300dc3b-e44e-4e2e-80b9-a80a908b7ba2 FS",
      "parent": "2fc11abe-f2e1-4536-a38e-2db5342eaa0a"
    },
    {
      "id": "ee1a2ef7-4fde-4efe-a5c5-501be455f9e8",
      "text": "Establish ingredient lot traceability fields",
      "custom_tooltip": "<b>Establish ingredient lot traceability fields</b><br>Define and implement the minimum data model fields required to map supplier ingredient lots through roast/finished-goods lots to packaging/label controls. Steps: (1) confirm naming conventions and required identifiers (supplier lot/COA number, effective dates, allergen evidence ID); (2) create a mapping dictionary and sample completed record; (3) validate that the co-packer/shared kitchen can capture/retain these identifiers during receiving, roast, and handoff; (4) perform a quick synthetic mapping check for each SKU using pilot-intended lots. Deliverables: traceability data-field specification, mapping dictionary, and evidence that the pilot mapping has no missing required fields.<br><b>Resources needed:</b><br><ul><li>Label/lot traceability coordinator</li><li>QA lead</li><li>Co-packer/shared kitchen documentation lead</li><li>Document control owner</li><li>Procurement lead</li></ul>",
      "start_date": "2026-10-07",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "a1ddc604-28ff-4dce-b767-4ba8ac9b041f FS",
      "parent": "2fc11abe-f2e1-4536-a38e-2db5342eaa0a"
    },
    {
      "id": "591cbeec-ae2a-4295-8e8f-6ac9b7b37809",
      "text": "Run documentation completeness and no-build gate",
      "custom_tooltip": "<b>Run documentation completeness and no-build gate</b><br>Perform a readiness review to ensure supplier documentation is complete, consistent, and usable for downstream label master creation and pilot lot traceability drill. Steps: (1) run a completeness check against a standardized checklist for all three SKUs and all nut types; (2) reconcile any discrepancies (missing lot IDs, inconsistent cross-contact wording, unclear effective dates); (3) apply a \u201cno-build until complete\u201d decision for label master and traceability drill execution; (4) create a gap log with owners and resolution dates. Deliverables: documentation completeness scorecard, gap log with owners, and a go/no-go status for moving into label master creation.<br><b>Resources needed:</b><br><ul><li>Label release/QA reviewer</li><li>Procurement lead</li><li>Allergen compliance specialist</li><li>Document control owner</li><li>Project milestone lead</li></ul>",
      "start_date": "2026-10-09",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "2fc11abe-f2e1-4536-a38e-2db5342eaa0a FF, ee1a2ef7-4fde-4efe-a5c5-501be455f9e8 FS",
      "parent": "2fc11abe-f2e1-4536-a38e-2db5342eaa0a"
    },

    {
      "id": "a17f8caa-b9a0-4994-9729-4dc823f84a01",
      "text": "Create roasting and cooling SOPs",
      "custom_tooltip": "<b>Create roasting and cooling SOPs</b><br>Draft SKU-relevant roasting and cooling SOPs, including measurable time/temperature targets, acceptable parameter bands, cooling duration targets, and required sanitation transition steps. Define recording fields (roast lot ID, operator, start/stop times, critical temps, batch/holding conditions) and specify how deviations are documented and dispositioned.<br><b>Resources needed:</b><br><ul><li>Food Safety/HACCP coordinator</li><li>Roasting/production lead</li><li>Quality/QA lead</li><li>Technical writer or process documentation owner</li></ul>",
      "start_date": "2026-10-11",

    {
      "id": "c769f053-150e-4aa9-bd9e-7c4604896e6e",
      "text": "Define protected storage conditions",
      "custom_tooltip": "<b>Define protected storage conditions</b><br>Define protected storage requirements to preserve freshness/crunch after roast: approved storage containers, humidity/temperature targets (and monitoring frequency), maximum hold durations, airflow/orientation rules, and labeling of storage lots. Specify how storage conditions are verified (logs/monitor readings) and how excursions are handled (quarantine/disposition criteria).<br><b>Resources needed:</b><br><ul><li>Quality/QA lead</li><li>Operations/storage lead</li><li>Facilities/maintenance contact</li><li>Food Safety/HACCP coordinator</li></ul>",
      "start_date": "2026-10-13",

      "progress": 0,
      "open": true,

    },
    {
      "id": "9a7491b9-91ee-476e-990d-d52662465ae8",
      "text": "Run feasibility parameter study",
      "custom_tooltip": "<b>Run feasibility parameter study</b><br>Conduct a short feasibility/fitness-for-use study in the shared facility to confirm equipment can hit the defined SOP parameter bands. Capture observed constraints (ramp-up limits, cooling equipment behavior, batch size limits), update SOPs with practical tolerances, and produce a final \u2018locked ranges\u2019 version for pilot execution.<br><b>Resources needed:</b><br><ul><li>Roasting/production lead</li><li>Co-packer/shared kitchen operations manager</li><li>Quality/QA lead</li><li>Process engineer (as available)</li></ul>",

    },
    {
      "id": "ca603312-6c19-4a33-8b3a-e02599e01274",
      "text": "Lock SOP acceptance and change control",
      "custom_tooltip": "<b>Lock SOP acceptance and change control</b><br>Publish final acceptance criteria for SOP execution and establish change control for any future adjustments (what can be changed without re-approval, what requires QA/HACCP sign-off, and how updates affect roast-to-pack evidence). Ensure all pilot planners know the required records and escalation/disposition steps for out-of-spec runs.<br><b>Resources needed:</b><br><ul><li>Quality/QA lead</li><li>Food Safety/HACCP coordinator</li><li>Label Release/Traceability coordinator (for evidence alignment)</li><li>Project/milestone lead</li></ul>",

      "text": "Set roast-to-pack windows per SKU and per channel (DTC vs farmers markets vs wholesale)",

    {
      "id": "dc555a1b-3dcf-40a9-88b2-64bcbda607ba",
      "text": "Qualify nut suppliers and COAs",
      "custom_tooltip": "<b>Qualify nut suppliers and COAs</b><br>Qualify at least two vetted suppliers per nut type, collect complete COAs, and compile allergen/cross-contact evidence required to support an allergen-compliant label master and lot-to-label traceability for all three SKUs. Deliverables include supplier qualification checklist, received COA/evidence index, and a supplier documentation completeness status report with an explicit no-build trigger for missing fields.<br><b>Resources needed:</b><br><ul><li>Supply Chain &amp; Procurement Manager</li><li>Food Safety/HACCP Coordinator</li><li>Allergen/Regulatory Compliance Lead</li><li>Supplier quality contacts</li><li>Document control coordinator</li></ul>",

    },
    {
      "id": "1c63f91f-10cc-4277-a876-9497c83861f0",
      "text": "Define roast and cooling SOP bands",
      "custom_tooltip": "<b>Define roast and cooling SOP bands</b><br>Draft roasting SOPs, cooling SOPs, and protected storage requirements using feasible parameter bands (time/temperature/cooling rate) rather than single-point targets. Include sanitation and allergen-cross-contact handling controls, measurable monitoring records (what to record, acceptable ranges, calibration needs), and operator instructions suitable for the co-packer/shared kitchen. Deliverables: roast SOP, cool SOP, storage SOP, and a monitoring/record template.<br><b>Resources needed:</b><br><ul><li>Food Safety/HACCP Coordinator</li><li>Process engineer or culinary lead</li><li>Co-packer/shared kitchen operations lead</li><li>QA documentation owner</li><li>Calibration/maintenance support (as needed)</li></ul>",

    },
    {
      "id": "f0be18cb-adf4-4cd5-a56c-a7efd2d5bab5",
      "text": "Set roast-to-pack windows by channel",
      "custom_tooltip": "<b>Set roast-to-pack windows by channel</b><br>Establish initial roast-to-pack timing windows per SKU and per channel (DTC vs farmers markets vs wholesale) using conservative assumptions aligned to worst-case handling. Version-control the rules, document eligibility calculations (days-since-roast), and define what triggers an exclusion (no-build/hold) if windows cannot be met. Deliverables: channel-specific roast-to-pack rule set, eligibility worksheet, and exception handling decision tree.<br><b>Resources needed:</b><br><ul><li>Supply Chain &amp; Procurement Manager</li><li>QA/Release owner</li><li>Channel ops representatives</li><li>Project manager for gating and change control</li></ul>",

    },
    {
      "id": "21b04a1a-8b38-42e3-90cc-ce9d48c8c86a",
      "text": "Establish freshness and crunch pass-fail",
      "custom_tooltip": "<b>Establish freshness and crunch pass-fail</b><br>Define measurable freshness/crunch benchmark metrics and pass/fail acceptance criteria for pilot qualification. Specify at least one sensory-based crunch/freshness rubric and, if available, an objective oxidation proxy aligned to supplier/QA capability. Deliverables: sensory rubric and training guide, sampling plan, data capture sheets, and locked acceptance thresholds for pilot lot release.<br><b>Resources needed:</b><br><ul><li>Sensory Science/Consumer Testing Lead</li><li>Flavor/Heat QA or formulation specialist</li><li>QA analyst</li><li>Co-packer/shared kitchen staff for sampling execution</li></ul>",

    },
    {
      "id": "92971820-02ff-4edb-98c3-4c6e8a17cfba",
      "text": "Pilot roast-to-pack execution results",
      "custom_tooltip": "<b>Pilot roast-to-pack execution results</b><br>Run pilot roast-to-pack cycles according to the roast SOP and channel eligibility rules, capturing days-since-roast outcomes and evidence that each finished-goods lot is eligible for its intended channel. Create the pilot evidence package that links ingredient COAs and roast/cooling/storage monitoring to finished-goods lots and pack dates, with explicit reporting on any window misses and resulting dispositions. Deliverables: completed pilot run records, eligibility audit log, and traceability evidence matrix for freshness control.<br><b>Resources needed:</b><br><ul><li>Co-packer/shared kitchen operations lead</li><li>QA/Documentation owner</li><li>Supply chain/procurement representative</li><li>Data analyst for evidence matrix</li><li>Food safety/HACCP coordinator</li></ul>",
      "start_date": "2026-10-23",

      "progress": 0,

    },

      "text": "Establish freshness/crunch benchmark metrics and measurable pass/fail criteria (including oxidation proxies if available)",

    {
      "id": "ca915e76-f227-4893-8a00-95580557a295",
      "text": "Define roast-to-pack window rules",
      "custom_tooltip": "<b>Define roast-to-pack window rules</b><br>Draft initial roast-to-pack eligibility windows for each of the 3 SKUs, including separate rules by channel (DTC vs farmers markets vs wholesale). Establish how \u201croast date/time\u201d and \u201cpack date/time\u201d are defined, what constitutes an on-time eligible lot, and what happens when boundaries are missed. Include assumptions for typical handling and any conservative buffers for early pilot operations.<br><b>Resources needed:</b><br><ul><li>Supply chain/procurement lead</li><li>Flavor/heat QA lead</li><li>Food safety/HACCP coordinator</li><li>Operations lead</li><li>Project manager</li></ul>",
      "start_date": "2026-10-24",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "58c1bb69-51e4-428f-8d20-dd9147535501 SS",

    {
      "id": "a67c9bc6-8293-4560-a04a-d536cf8dad03",
      "text": "Create pilot roast-to-pack scheduling plan",
      "custom_tooltip": "<b>Create pilot roast-to-pack scheduling plan</b><br>Translate the eligibility window rules into a practical scheduling plan for pilot cycles. Include capacity-aware roast/cooling/storage sequencing, co-packer/shared kitchen slot timing, and required recording points (roast start/end, cooling completion, protected storage start/end, pack time). Specify contingency options (e.g., alternate batch timing, additional pilot runs) if scheduling constraints threaten compliance with windows.<br><b>Resources needed:</b><br><ul><li>Operations lead</li><li>Co-packer/shared kitchen scheduler</li><li>Food safety/HACCP coordinator</li><li>Data/traceability coordinator</li></ul>",
      "start_date": "2026-10-26",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "ca915e76-f227-4893-8a00-95580557a295 FS",

    },
    {
      "id": "978fe05d-cf96-43dc-96d7-97dcfe8f48d5",
      "text": "Validate handling assumptions via pilot runs",
      "custom_tooltip": "<b>Validate handling assumptions via pilot runs</b><br>Run pilot roast-to-pack cycles under the defined scheduling and handling SOPs, using real batch/lot records to confirm that the actual days-since-roast and time-in-storage align with the eligibility window definitions. Capture deviations (early/late roast-to-pack, storage temperature/time excursions, rework) and document whether product remains within eligibility or triggers a disposition decision.<br><b>Resources needed:</b><br><ul><li>Co-packer/shared kitchen QA</li><li>Traceability/data coordinator</li><li>Food safety/HACCP coordinator</li><li>Project manager</li></ul>",
      "start_date": "2026-10-28",
      "duration": 2.0,
      "progress": 0,
      "open": true,

    },
    {
      "id": "47f5e6b4-c60b-4506-9cf6-26c4cce7caaa",
      "text": "Finalize days-since-roast release criteria",
      "custom_tooltip": "<b>Finalize days-since-roast release criteria</b><br>After pilot validation, lock the final roast-to-pack window parameters and channel-specific release rules. Publish the decision logic for lot disposition (release vs hold vs rework/reject), including how exceptions are approved and documented. Ensure the rules are consistent with subsequent freshness/crunch benchmarks so launch readiness gates can be executed without ambiguity.<br><b>Resources needed:</b><br><ul><li>Food safety/HACCP coordinator</li><li>Flavor/heat QA lead</li><li>Operations lead</li><li>Project manager</li></ul>",
      "start_date": "2026-10-30",
      "duration": 2.0,
      "progress": 0,

    {
      "id": "a66522c7-5eca-4b13-bd7e-6b1cf6008de0",
      "text": "Define freshness and crunch metrics",
      "custom_tooltip": "<b>Define freshness and crunch metrics</b><br>Select measurable freshness/crunch benchmark metrics for each of the three SKUs and map each metric to an objective sensory rubric definition. Confirm which metrics are sensory-based (e.g., crunch score rubric) and which are objective proxies (e.g., oxidation/fat proxy where available), including required sample handling, scoring scales, and pass/fail target ranges to support downstream roast-to-pack eligibility decisions.<br><b>Resources needed:</b><br><ul><li>Flavor Formulation &amp; Heat QA Lead</li><li>Sensory Science &amp; Consumer Testing Lead</li><li>Food Safety &amp; HACCP Coordinator</li><li>Lab/QA analyst</li><li>Sampling and serving materials</li></ul>",
      "start_date": "2026-11-01",
      "duration": 2.0,
      "progress": 0,

      "meta": "bd631b3d-c866-4f54-8b1a-9cc68a12da8e SS",

    },
    {
      "id": "f447d2f5-cbbc-4a15-951c-0b2e04885a66",
      "text": "Validate proxy feasibility with suppliers",
      "custom_tooltip": "<b>Validate proxy feasibility with suppliers</b><br>Review supplier COA/spec availability to determine whether objective proxies (e.g., oxidation indicators, moisture proxies) are provided consistently and comparably across nut types and suppliers. Define what evidence is required for each metric (COA fields, effective dates, lot identifiers) and identify gaps that require lab testing or alternative proxies. Establish a documentation completeness checklist and escalation path if required proxy data cannot be obtained in time.<br><b>Resources needed:</b><br><ul><li>Supply Chain &amp; Procurement Manager</li><li>Food Safety &amp; HACCP Coordinator</li><li>QA documentation owner</li><li>Supplier representatives</li><li>Supplier COA templates/checklist</li></ul>",

      "duration": 2.0,
      "progress": 0,
      "open": true,

      "parent": "bd631b3d-c866-4f54-8b1a-9cc68a12da8e"
    },
    {
      "id": "c65bf96f-b402-4ca3-8fb5-f89aa3e862f8",
      "text": "Run calibration set for thresholds",
      "custom_tooltip": "<b>Run calibration set for thresholds</b><br>Conduct a small calibration pilot using representative nuts/lots to confirm that chosen benchmarks correlate with perceived freshness/crunch quality. Execute blinded or standardized sensory sessions, collect metric readings for objective proxies (if available), and analyze repeatability and correlation to perception. Lock metric-specific pass/fail criteria only after calibration shows sufficient discrimination and repeatability for pilot decision-making.<br><b>Resources needed:</b><br><ul><li>Sensory panelists</li><li>Sensory Science &amp; Consumer Testing Lead</li><li>Lab/QA analyst</li><li>Statistical support (R/Python)</li><li>Calibration samples and SOPs</li></ul>",

      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "f447d2f5-cbbc-4a15-951c-0b2e04885a66 FS",
      "parent": "bd631b3d-c866-4f54-8b1a-9cc68a12da8e"
    },
    {
      "id": "bfade002-b660-40e7-b738-81e9a93b0e1b",
      "text": "Publish freshness benchmark release criteria",
      "custom_tooltip": "<b>Publish freshness benchmark release criteria</b><br>Document the finalized freshness/crunch benchmark release criteria as a controlled QA standard. Include metric definitions, scoring rubric, sample prep/storage requirements, test frequency for pilot lots, decision rules for pass/fail, and how outcomes will feed into roast-to-pack eligibility and lot release. Produce a one-page quick reference plus the full controlled protocol for use by co-packer/shared kitchen QA during pilots.<br><b>Resources needed:</b><br><ul><li>Food Safety &amp; HACCP Coordinator</li><li>Flavor Formulation &amp; Heat QA Lead</li><li>QA documentation control owner</li><li>Co-packer/shared kitchen QA lead</li><li>Controlled SOP and quick-reference sheets</li></ul>",

      "progress": 0,
      "open": true,

      "parent": "bd631b3d-c866-4f54-8b1a-9cc68a12da8e"
    },

      "text": "Run channel-specific handling and shelf-life proxy simulations to validate freshness retention",

    {
      "id": "eed45f5c-17e9-4808-b178-c98f519c3083",
      "text": "Run roast-to-pack pilot cycles",
      "custom_tooltip": "<b>Run roast-to-pack pilot cycles</b><br>Execute pilot roast-to-pack runs and record days-since-roast eligibility outcomes. Confirm actual roast parameters, cooling/storage handling, and schedule adherence for each SKU and channel assumption (DTC vs farmers market). Capture roast lot IDs, roasted/cooling timestamps, storage conditions, pack dates, and any deviations that affect eligibility rules. Deliverable is a complete roast-to-pack evidence dataset per pilot cycle suitable for eligibility-rule validation and traceability linking.<br><b>Resources needed:</b><br><ul><li>Supply chain/procurement lead</li><li>Roasting/co-packer operations lead</li><li>QA/traceability coordinator</li><li>Food safety/HACCP coordinator</li><li>Data recorder (ops admin or QA assistant)</li></ul>",

    {
      "id": "ec9f4d02-0a0e-477a-8011-52a528eb5edc",
      "text": "Define freshness and crunch pass criteria",
      "custom_tooltip": "<b>Define freshness and crunch pass criteria</b><br>Establish measurable freshness/crunch benchmark metrics and numeric pass/fail criteria (including any oxidation proxy where available). Define sample selection and scoring approach (sensory rubric and/or objective indicators), acceptance thresholds, and how results map to days-since-roast eligibility and release decisions. Produce a single criteria sheet and measurement plan that can be executed consistently across pilot lots and later production runs.<br><b>Resources needed:</b><br><ul><li>Sensory science lead</li><li>Flavor/heat QA lead</li><li>Food safety/HACCP coordinator</li><li>QA analyst</li><li>Statistician (optional for threshold validation)</li></ul>",
      "start_date": "2026-11-11",
      "duration": 2.0,
      "progress": 0,
      "open": true,
      "meta": "eed45f5c-17e9-4808-b178-c98f519c3083 FS",

    },
    {
      "id": "fbfe19d2-dd6c-4647-9d8f-c2c28315d706",
      "text": "Validate handling storage simulations",
      "custom_tooltip": "<b>Validate handling storage simulations</b><br>Run channel-specific handling and shelf-life proxy simulations tied to freshness/crunch outcomes. Implement controlled warm-ambient staging and handling protocols representative of CT/RI usage, with logged temperature/time exposure and standardized handling steps. Compare observed/simulated freshness decline against the predefined pass/fail criteria and confirm that the minimum-quality timepoint proxy used for later governance aligns with expected customer-relevant perception and quality retention.<br><b>Resources needed:</b><br><ul><li>Packaging/quality lead</li><li>QA technician (sample handling and logging)</li><li>Sensory science lead</li><li>Co-packer/shared kitchen staff</li><li>Data logger or temperature monitoring equipment</li></ul>",
      "start_date": "2026-11-13",
      "duration": 2.0,
      "progress": 0,

      "meta": "ec9f4d02-0a0e-477a-8011-52a528eb5edc FS",

    },
    {
      "id": "d538e4c6-877f-4ee0-8ea3-d054323dc93c",
      "text": "Publish freshness validation and rules",
      "custom_tooltip": "<b>Publish freshness validation and rules</b><br>Publish pilot results and finalize lot release rules tied to freshness evidence. Determine which roast-to-pack window and eligibility policy are supported by pilot data, including guidance for what triggers an additional pilot/retest or tighter handling constraints. Produce the final roast-to-pack SOP delta (or rulebook), including eligibility thresholds, evidence requirements for release, and the mapping from supplier COAs/roast lots to finished-goods lots and pack dates with zero traceability gaps for pilot units.<br><b>Resources needed:</b><br><ul><li>QA lead</li><li>Supply chain/procurement lead</li><li>Sensory science lead</li><li>Label/traceability coordinator (for release mapping)</li><li>Project/milestone lead</li></ul>",

    {
      "id": "1dd98c38-eddd-4abe-9e21-a30eb0ba99e1",
      "text": "Publish sourcing/timing validation results and finalize lot release rules tied to freshness evidence",
      "custom_tooltip": "<b>Publish sourcing/timing validation results and finalize lot release rules tied to freshness evidence</b>",

      "custom_tooltip": "<b>Specify DTC shipping packaging BOM</b><br>Select and document the exact DTC carton, cushioning, insulation (if used), orientation rules, and label/lot/pack-date placement for the 6oz resealable pouch. Create a DTC packaging BOM with alternates and confirm readability/handling requirements. Run a small prototype/fit check to verify that lot/pack-date visibility and pouch protection are achieved without interfering with labeling or opening.<br><b>Resources needed:</b><br><ul><li>Packaging engineer or packaging QA lead</li><li>DTC fulfillment operations lead</li><li>Purchasing/materials coordinator</li><li>Co-packer or shared kitchen operations representative</li><li>QA labeling/traceability coordinator</li></ul>",

      "text": "Run transit abuse simulation protocol",
      "custom_tooltip": "<b>Run transit abuse simulation protocol</b><br>Execute shipping abuse simulations aligned to CT/RI usage: warm ambient staging, jostle/vibration, stacking, orientation stress, and worst-case transit delay/temperature exposure. Use a predefined scenario matrix tied to the DTC packaging configuration from the BOM. Log conditions and outcomes with a standardized defect taxonomy, then compute observed damage/defect rates by scenario.<br><b>Resources needed:</b><br><ul><li>Shipping/packaging test lead</li><li>Facilities coordinator (controlled staging space)</li><li>Packaging engineer</li><li>QA lead</li><li>Data analyst</li></ul>",

      "text": "Draft DTC cutoff policy",
      "custom_tooltip": "<b>Draft DTC cutoff policy</b><br>Define the DTC fulfillment promise and shipping cutoff logic per SKU using the current roast-to-pack windows and pilot stop/go constraints. Capture assumptions (days-since-roast rules, fulfillment lead time, carrier transit variability, weekends/holidays) and specify when product can leave the facility versus must be held. Deliverable includes a draft policy document with clear pass/fail eligibility rules and a versioned change log.<br><b>Resources needed:</b><br><ul><li>DTC Fulfillment &amp; Operations lead</li><li>QA lead</li><li>Supply chain/production scheduler</li><li>Project manager</li></ul>",

      "text": "Map cutoff rules to release evidence",
      "custom_tooltip": "<b>Map cutoff rules to release evidence</b><br>Translate the cutoff policy into operational release evidence requirements: what checks (lot code, pack date, seal integrity status, descriptor version, and any quarantine flags) must be verified before shipment. Produce an eligibility checklist and a mapping table from each policy rule to the exact evidence artifact/record field required by QA and pick/pack.<br><b>Resources needed:</b><br><ul><li>QA lead</li><li>Label/traceability coordinator</li><li>DTC fulfillment lead</li><li>Co-packer documentation/control lead</li></ul>",

      "text": "Run policy revision review loop",
      "custom_tooltip": "<b>Run policy revision review loop</b><br>Conduct a structured review loop with stakeholders (QA, labeling/traceability, co-packer ops, and fulfillment) to adjust the cutoff calendar and logic based on feasibility and any pilot evidence updates. Use documented decision gates: if pilot stop/go results or roast-to-pack windows change, re-issue the policy with updated assumptions and confirm operational impact (inventory hold time, throughput risk). Output is a controlled, approved version of the DTC cutoff policy.<br><b>Resources needed:</b><br><ul><li>DTC fulfillment lead</li><li>QA lead</li><li>Label release owner</li><li>Co-packer ops lead</li><li>Project manager</li></ul>",

      "text": "Freeze cutoff policy for pilots",
      "custom_tooltip": "<b>Freeze cutoff policy for pilots</b><br>Finalize and lock the DTC cutoff policy version for pilot execution and early launch operations. Communicate the frozen policy to co-packer/fulfillment teams, confirm the calendar rules are implemented in pick/pack workflows, and verify that the policy can be executed without ambiguity during peak periods (weekends/events). Deliverable includes training confirmation and a final policy release notice.<br><b>Resources needed:</b><br><ul><li>DTC fulfillment lead</li><li>Co-packer ops supervisor</li><li>QA lead</li><li>Training/operations coordinator</li></ul>",

      "text": "Run shipping abuse and transit tests",
      "custom_tooltip": "<b>Run shipping abuse and transit tests</b><br>Execute physical and/or simulated shipping abuse tests to validate damage-rate and temperature exposure under worst-case CT/RI handling conditions. Define test scenarios aligned to the shipping cutoff policy (e.g., warm ambient staging, jostle/vibration, stacking time, and maximum transit delay). Predefine a defect-mode taxonomy and evidence capture method (photo records, reason codes, and associated carton/lot configuration) to map observed failures back to upstream packaging parameters.<br><b>Resources needed:</b><br><ul><li>Packaging testing lead</li><li>Logistics test specialist or lab</li><li>Co-packer ops contact</li><li>QA representative</li><li>Materials technician</li></ul>",

      "custom_tooltip": "<b>Set incident triage reason codes</b><br>Implement an incident reason-code taxonomy and decision-tree mapping that ties customer issues (leak/damage, heat descriptor mismatch, freshness/storage concerns) to required upstream evidence checks. Specify what evidence is needed per reason code (lot code/pack date verification, seal integrity indicators, storage conditions, and packaging configuration identifier) and how to quarantine vs release decisions are triggered. Rehearse the triage workflow once with a representative scenario to confirm turnaround readiness for early launch response.<br><b>Resources needed:</b><br><ul><li>Customer experience/CS operations lead</li><li>QA and traceability coordinator</li><li>Food safety/allergen compliance lead (as needed for hold/release logic)</li><li>Project manager</li></ul>",

      "text": "Run impact/vibration and worst-case tests",
      "custom_tooltip": "<b>Run impact/vibration and worst-case tests</b><br>Execute the planned abuse tests using either available equipment (vibration/impact rigs, temperature-controlled staging) or validated surrogates (tabletop impulse/jostle fixtures plus controlled ambient temperature profiles). Run stabilization and replicate counts per scenario, record environmental conditions and handling parameters, and capture high-resolution photos and defect observations for each unit immediately after conditioning.<br><b>Resources needed:</b><br><ul><li>Test equipment operator</li><li>Packaging technician</li><li>QA observer</li><li>Facilities/staging coordinator</li><li>Data recorder</li></ul>",

    {
      "id": "758aeefc-5760-4c0c-aff8-55ef4567fe44",
      "text": "Log defects and assign reason codes",
      "custom_tooltip": "<b>Log defects and assign reason codes</b><br>Classify each outcome into a predefined damage/incident taxonomy (e.g., channel leak, edge leak, creasing, reseal adhesion loss, label interference) and assign incident reason codes mapped to evidence requirements. Ensure consistent defect scoring rules across operators, perform quick calibration checks if multiple scorers are used, and link each result to the original sample\u2019s SKU/lot/configuration ID.<br><b>Resources needed:</b><br><ul><li>Packaging QA lead</li><li>QA documentation coordinator</li><li>Reviewer/scorer</li><li>Data analyst</li></ul>",

    {
      "id": "562452f3-d9f7-4ff2-a157-33a3f79476b4",
      "text": "Summarize results and pass/fail decisions",
      "custom_tooltip": "<b>Summarize results and pass/fail decisions</b><br>Analyze scenario results to compute damage rates and confidence intervals versus the pilot stop/go thresholds, and identify which defect modes dominate under each scenario. Produce a short decision package showing whether the current DTC packing configuration meets the cutoff criteria; if not, recommend configuration adjustments (orientation, cushioning density, insulation choice) and define which scenarios to re-run after changes.<br><b>Resources needed:</b><br><ul><li>Packaging QA lead</li><li>Data analyst</li><li>Project manager</li><li>DTC fulfillment lead</li></ul>",

    {
      "id": "8c4d2f74-7f7c-480b-b026-ff8cfe113bc4",
      "text": "Define DTC shipping cutoff policy",
      "custom_tooltip": "<b>Define DTC shipping cutoff policy</b><br>Draft and lock the DTC fulfillment promise and shipping cutoff rules that translate roast-to-pack eligibility (and any packaging/QA stop/go conditions) into customer-facing dispatch dates. Include assumptions for lead times, weekends/event handling, and worst-case variability; run a controlled revision loop until the cutoff policy aligns with pilot results and acceptable damage/returns targets.<br><b>Resources needed:</b><br><ul><li>DTC fulfillment lead</li><li>QA/packaging lead</li><li>Operations/warehouse lead</li><li>Project manager</li><li>E-commerce/CS input reviewer</li></ul>",

      "progress": 0,

    {
      "id": "9edb163b-27fa-474e-aaab-ed1b94fd43b3",
      "text": "Specify carton and cushioning configuration",
      "custom_tooltip": "<b>Specify carton and cushioning configuration</b><br>Select and document the exact DTC shipping materials and configuration: carton type/size, cushioning/void fill/liners, insulation if used, orientation rules, and the placement method for lot/pack date identifiers (as applicable). Produce a packaging BOM with alternates to avoid lead-time risk, and validate basic readability/label placement and component compatibility with the pouch outer dimensions and barrier features from the packaging pilot.<br><b>Resources needed:</b><br><ul><li>Packaging engineer or packaging QA specialist</li><li>Procurement/packaging sourcing coordinator</li><li>DTC fulfillment lead</li><li>Compliance reviewer (if labeling placement needs review)</li></ul>",

    },
    {
      "id": "4377b786-df33-4a8e-a75b-bb0627ca297c",
      "text": "Build pick/pack QC checklists",
      "custom_tooltip": "<b>Build pick/pack QC checklists</b><br>Create error-proofed pick/pack QC standards and checklists that prevent SKU/lot mix-ups and reduce incident probability. Define required verification steps (scanner vs manual), acceptance criteria for correct SKU/lot/label, documentation fields for every shipped unit/batch, and escalation/hold steps for anomalies. Validate the workflow with a quick mock dry-run using representative lots/labels.<br><b>Resources needed:</b><br><ul><li>DTC operations specialist</li><li>QA/traceability coordinator</li><li>Co-packer/shared kitchen ops contact</li><li>IT/systems support (if using scanners/QR or manifest IDs)</li></ul>",

    {
      "id": "706a0b66-5e77-4fe5-96eb-c4693344726c",
      "text": "Run shipping abuse simulations",
      "custom_tooltip": "<b>Run shipping abuse simulations</b><br>Execute worst-case transit protection simulations reflecting CT/RI usage: warm ambient exposure/staging, vibration/impact/jostle, stacking/handling, and temperature-time profiles. Map observed defect modes to the pre-defined incident taxonomy (leak/damage/heat-mismatch/freshness-related where applicable). Use a staged approach (calibration micro-trials followed by decision-grade replicates) with fixed environmental setpoints and structured incident logging.<br><b>Resources needed:</b><br><ul><li>Shipping test lead</li><li>Packaging QA specialist</li><li>Lab/testing equipment technician or coordinator</li><li>Operations support for staging/handling scripts</li><li>Data analyst (for run tracking and results compilation)</li></ul>",

      "duration": 1.0,

    },
    {
      "id": "2819e5fa-cd54-41b5-aeea-aaae3b4b55ba",
      "text": "Model expected damage and incidents",
      "custom_tooltip": "<b>Model expected damage and incidents</b><br>Build a decision model that estimates expected damage/incident rates under each shipping cutoff and packaging scenario using pilot simulation outcomes. Lock scenario inputs to the finalized DTC packaging BOM and labeling/lot placement rules, calibrate with an initial small set if needed, and produce a go/no-go recommendation that can be directly compared to the pilot stop/go targets for damage rate and traceability-driven incident mapping.<br><b>Resources needed:</b><br><ul><li>Data analyst (Python/Excel modeling)</li><li>QA/packaging lead</li><li>DTC fulfillment lead</li><li>Project manager</li><li>Operations representative</li></ul>",

      "id": "d2f8d4b3-2858-4783-99db-28dce7646666",
      "text": "Define DTC cutoff and qualification rules",
      "custom_tooltip": "<b>Define DTC cutoff and qualification rules</b><br>Draft and freeze DTC shipping cutoff policy and qualification eligibility rules that tie directly to roast-to-pack windows and packaging/quality stop/go criteria. Include SKU-level cutoffs, last-ship dates, pick/pack timing, weekend/holiday handling assumptions, and revision/change-control triggers when upstream evidence updates. Deliverable is a single policy document that operations can execute without interpretation.<br><b>Resources needed:</b><br><ul><li>DTC fulfillment operations lead</li><li>QA lead</li><li>Project milestone lead</li><li>E-commerce operations specialist</li></ul>",

      "id": "334d13ea-2841-4472-9cdf-b4dd2ba69d20",
      "text": "Specify carton, cushion, and orientation",
      "custom_tooltip": "<b>Specify carton, cushion, and orientation</b><br>Select and specify the DTC shipping configuration (carton type, cushioning/void fill, insulation if used) and the physical orientation rules for the 6oz pouch to minimize crease/leak risks. Produce a packaging BOM with dimensional/part requirements, substitution alternates, and label/lot/pack-date placement constraints. Include a prototype check for readability and correct placement on shipping units.<br><b>Resources needed:</b><br><ul><li>Packaging engineer or packaging QA lead</li><li>Procurement/materials coordinator</li><li>DTC fulfillment lead</li><li>Co-packer/shared kitchen rep</li></ul>",

    {
      "id": "95a01e7e-59e5-4ee1-bfb6-3954f05d45f8",
      "text": "Build pick/pack QC and scanning checks",
      "custom_tooltip": "<b>Build pick/pack QC and scanning checks</b><br>Create pick/pack QC checklists and error-proofing steps to prevent wrong-SKU/lot/label incidents. Define scanner usage rules, verification sequence (SKU, lot code, label/print ID), acceptance criteria for correct packing, and escalation steps when deviations occur. Validate the checklist via a mock run using representative lots/labels before shipping pilots.<br><b>Resources needed:</b><br><ul><li>QA lead</li><li>Co-packer operations lead</li><li>DTC fulfillment lead</li><li>Label/traceability coordinator</li></ul>",

      "id": "aeac9a95-32d1-4a78-a67b-616f816a9dd6",
      "text": "Run shipping abuse and temperature tests",
      "custom_tooltip": "<b>Run shipping abuse and temperature tests</b><br>Execute controlled shipping abuse simulations aligned to CT/RI usage: worst-case warm ambient exposure, vibration/impact or equivalent disturbance, stacking, and jostle scenarios plus any staging-on-booth constraints. Use documented setpoints, stabilization times, and consistent sample handling. Record defect observations using a defined damage mode taxonomy for mapping to root causes and acceptance thresholds.<br><b>Resources needed:</b><br><ul><li>Shipping test coordinator</li><li>Packaging QA lead</li><li>Lab/engineering support or test lab</li><li>DTC fulfillment lead</li></ul>",

    {
      "id": "9c36178b-6ff2-4c0e-8ed6-58cb7d95aa61",
      "text": "Set incident reason codes and stop-go",
      "custom_tooltip": "<b>Set incident reason codes and stop-go</b><br>Implement an incident reason-code taxonomy and QA evidence mapping that supports rapid triage (e.g., leak/damage vs heat descriptor mismatch vs freshness/storage). Crosswalk each reason code to required evidence checks (lot code, pack date, seal/reseal outcomes, storage conditions) and a documented decision tree for quarantine/release. Use pilot/abuse results to set and publish the final stop/go acceptance criteria for DTC shipping configuration and cutoff policy.<br><b>Resources needed:</b><br><ul><li>QA lead</li><li>Compliance/food labeling lead</li><li>Project milestone lead</li><li>Co-packer documentation control representative</li></ul>",

    {
      "id": "9025a1e8-07a7-4003-94d6-fcc9cc0f2f7e",
      "text": "Finalize allergen lists for 3 SKUs",
      "custom_tooltip": "<b>Finalize allergen lists for 3 SKUs</b><br>Compile the final ingredient statements and allergen/cross-contact declarations for each of the 3 SKUs. Validate that every supplier-provided allergen statement is consistent with the product formulation, and define required wording for compliant labeling (including distributor/manufacturer fields as applicable). Deliverable includes a SKU-by-SKU allergen/ingredient input sheet ready for labeling master build.<br><b>Resources needed:</b><br><ul><li>Food labeling and allergen compliance lead</li><li>Compliance/labeling reviewer</li><li>Regulatory consultant (as needed)</li><li>QA documentation owner</li><li>Supplier documentation point person</li></ul>",

    {
      "id": "0f3147ff-40b2-469a-8108-0c3bad8ad1ef",
      "text": "Collect supplier COAs and evidence",
      "custom_tooltip": "<b>Collect supplier COAs and evidence</b><br>Request, review, and archive supplier COAs and supporting evidence needed to substantiate the label (ingredient specs, allergen/cross-contact evidence, lot identification fields, and any sanitation cross-contact support as required). Perform an evidence completeness check per SKU and block any &#x27;no-build&#x27; conditions until the label master prerequisites are met for pilot lots.<br><b>Resources needed:</b><br><ul><li>QA documentation owner</li><li>Supply chain/procurement coordinator</li><li>Allergen labeling lead</li><li>Supplier reps (nut/spice documentation contacts)</li></ul>",

    {
      "id": "5abe38b6-f7c8-45e5-a47b-0e027b2db4f9",
      "text": "Create controlled label master artwork set",
      "custom_tooltip": "<b>Create controlled label master artwork set</b><br>Build the label master control package with version control and controlled variable fields: artwork revision numbers, heat descriptor text/versions, net quantity fields, lot/print field formatting, and any required manufacturer/distributor lines. Define a single Label Release Owner and run the proofing workflow to prepare label files for co-packer print/attachment operations without uncontrolled edits.<br><b>Resources needed:</b><br><ul><li>Labeling graphic/production coordinator</li><li>Label Release Owner</li><li>Food labeling and allergen compliance reviewer</li><li>Data manager for version control</li><li>Label proofing specialist (if separate)</li></ul>",

    {
      "id": "e0af7ff7-1bed-47b6-bb4b-9888d89faf14",
      "text": "Design lot-to-label traceability model",
      "custom_tooltip": "<b>Design lot-to-label traceability model</b><br>Design and document the lot-to-label data model linking: supplier ingredient lots \u2192 incoming COAs \u2192 formulation/roast/batch IDs \u2192 finished-goods lots \u2192 pouch SKU \u2192 label SKU/version \u2192 label roll/print identifiers \u2192 pack date and shipment/case identifiers. Include a minimal required data set for the pilot drill and provide a worked example record to confirm the mapping works end-to-end across all 3 SKUs.<br><b>Resources needed:</b><br><ul><li>Labeling and traceability coordinator</li><li>Co-packer/shared kitchen QA lead</li><li>Data modeler/spreadsheet owner (optional)</li><li>Label Release Owner</li></ul>",

      "open": true,

    },
    {
      "id": "6c13211d-2260-4782-a1d5-c7b8bcd71575",
      "text": "Assemble mock hold/release binder",
      "custom_tooltip": "<b>Assemble mock hold/release binder</b><br>Assemble the mock hold/release binder with named document owners, retrieval SLAs (target: within 24 hours), and quarantine scope rules for labeling/traceability deviations. Include the evidence index and a representative decision workflow (quarantine \u2192 evidence retrieval \u2192 disposition/return or salvage) so the binder can be used during a traceability drill with documented response-time feasibility.<br><b>Resources needed:</b><br><ul><li>Compliance/QA binder coordinator</li><li>Label Release Owner</li><li>Co-packer/shared kitchen documentation control lead</li><li>QA/food safety lead</li><li>Customer returns/damage workflow owner (as applicable)</li></ul>",

    {
      "id": "e7a2c665-9b1d-47a2-a09f-32838fc30b48",
      "text": "Design traceability data model",
      "custom_tooltip": "<b>Design traceability data model</b><br>Define the lot-to-label traceability fields, identifier conventions, and required linkages from supplier ingredient lots through roasting/formulation/finished-goods lots to the exact label/artwork version and label print/roll IDs used on filled pouches. Deliverables include a one-page field dictionary, example filled-in record templates, and a minimal required dataset for pilot drill success.<br><b>Resources needed:</b><br><ul><li>Label Release &amp; Lot-Traceability Coordinator</li><li>Co-packer/shared kitchen QA lead</li><li>Food safety/allergen labeling compliance lead</li><li>Data/operations analyst (spreadsheet/templating)</li></ul>",

    {
      "id": "cd0f9fe8-594a-46ff-9051-42bdceeb489f",
      "text": "Prepare label master control set",
      "custom_tooltip": "<b>Prepare label master control set</b><br>Create and lock the controlled label master set with version control, artwork revision numbering, heat descriptor text governance fields, net quantity, and lot/label code placement requirements. Establish the Label Release Owner authority, effective dates, and the rules for approved changes to ensure no descriptor or artwork drift during pilot execution.<br><b>Resources needed:</b><br><ul><li>Food labeling/allergen compliance specialist</li><li>Label Release &amp; Lot-Traceability Coordinator</li><li>Design/artwork producer (as needed)</li><li>Co-packer labeling print/production liaison</li></ul>",

    {
      "id": "65b8c7f2-2e3c-4c1e-ac66-88c856b495f3",
      "text": "Run lot-to-label traceability drill",
      "custom_tooltip": "<b>Run lot-to-label traceability drill</b><br>Execute a drill across all 3 SKUs using pilot lots to verify 100% correct artwork/label revision attachment and correct mapping from each finished-goods lot to the exact label print/roll IDs. Include a referential integrity check (no orphan records, no missing mappings), a discrepancy log, and closure actions for any corrections prior to final sign-off.<br><b>Resources needed:</b><br><ul><li>Label Release &amp; Lot-Traceability Coordinator</li><li>Co-packer/shared kitchen QA lead</li><li>Operations/documentation control owner</li><li>Project manager (to chase gaps same-day)</li></ul>",

    {
      "id": "f352b8b8-dd81-45c5-85b1-9a96818efb01",
      "text": "Assemble and rehearse hold release binder",
      "custom_tooltip": "<b>Assemble and rehearse hold release binder</b><br>Assemble a mock hold/release binder for labeling and traceability deviations, with named evidence owners, retrieval paths, and explicit 24-hour retrieval SLAs. Rehearse at least one representative deviation scenario and time the end-to-end response (request \u2192 evidence retrieval \u2192 quarantine scope confirmation \u2192 disposition). Record results, gaps, and CAPA-style improvements if the SLA is at risk.<br><b>Resources needed:</b><br><ul><li>Food safety/allergen compliance lead</li><li>Co-packer/shared kitchen documentation control QA lead</li><li>Label Release Owner</li><li>Project manager (SLA tracking and rehearsal facilitation)</li></ul>",

    {
      "id": "ac87ca35-f0f1-4ad8-a428-8c4d1f5e978b",
      "text": "Obtain labeling sign-off for zero errors",
      "custom_tooltip": "<b>Obtain labeling sign-off for zero errors</b><br>Perform an internal pre-check of all drilled units against the acceptance checklist (allergen/label fields, lot code correctness, artwork/print revision match, and descriptor version alignment). Then obtain external/lead expert sign-off for the traceability drill outcome and hold/release readiness, ensuring the final decision reflects zero label-attachment or traceability failures and the binder is operationally executable.<br><b>Resources needed:</b><br><ul><li>Food labeling/allergen compliance specialist</li><li>Label Release &amp; Lot-Traceability Coordinator</li><li>QA lead (co-packer and/or internal)</li><li>Project owner/decision authority</li></ul>",

    {
      "id": "81d32ed4-8bd1-486d-b9d5-9aeb1b2574ed",
      "text": "Lock pilot schedule and dependencies",
      "custom_tooltip": "<b>Lock pilot schedule and dependencies</b><br>Create the integrated pilot calendar and lock the hard dependencies across packaging feasibility, label master/traceability drill, heat sensory checks, and roast-to-pack runs. Define critical dates (label sign-off deadline, ingredient/COA cutoff, pouch line reservation window, pilot run batch dates, sensory panel windows) and add a change-control rule for any late label/art updates that would require reprint/rework or pilot SKU scope reduction.<br><b>Resources needed:</b><br><ul><li>Project milestone lead</li><li>Co-packer/shared kitchen operations manager</li><li>Packaging QA &amp; reseal validation specialist</li><li>Label release &amp; lot-traceability coordinator</li><li>Sensory/heat QA lead</li><li>Procurement/roast-to-pack lead</li><li>Compliance/labeling reviewer</li></ul>",
      "start_date": "2027-01-20",

    },
    {
      "id": "34fbbf99-c164-46c8-ae81-2301e8238d0a",
      "text": "Prepare SKU batch records and sampling plans",
      "custom_tooltip": "<b>Prepare SKU batch records and sampling plans</b><br>For each SKU, prepare locked pilot batch record templates with the required process parameters (mix order-of-operations, mixing/rest timing, filling/seal settings, label attachment steps, lot-code discipline) and define the exact sampling schedule for: in-process seal integrity tests, reseal/leak/ingress checks, abuse/transit sample pulls, and sensory evaluations at T0 and the minimum-quality timepoint proxy. Ensure sampling identifiers map to lot codes for downstream traceability drill readiness.<br><b>Resources needed:</b><br><ul><li>QA lead</li><li>Co-packer documentation control/QA coordinator</li><li>Packaging engineer or packaging tech supervisor</li><li>Sensory science lead</li><li>Lot traceability coordinator</li></ul>",
      "start_date": "2027-01-21",
      "duration": 1.0,
      "progress": 0,

      "meta": "81d32ed4-8bd1-486d-b9d5-9aeb1b2574ed FS",

    },
    {
      "id": "06b62d0f-e05f-493c-8388-1eaa6fe004dc",
      "text": "Coordinate pilot execution with line readiness",
      "custom_tooltip": "<b>Coordinate pilot execution with line readiness</b><br>Conduct a pre-start line readiness review with the co-packer/shared kitchen to confirm that the reserved pouch/sealing configuration, test instruments/tools, calibration status, label print/attachment workflow, and 100% in-process seal integrity testing plan are all ready to execute. Include contingency roles and stop/go escalation paths so any deviations during the pilot run are documented immediately and handled per the authority workflow.<br><b>Resources needed:</b><br><ul><li>Co-packer ops/site manager</li><li>Co-packer QA lead</li><li>Packaging reseal/barrier validation specialist</li><li>Label workflow/print technician (co-packer)</li><li>Project manager</li></ul>",
      "start_date": "2027-01-22",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "34fbbf99-c164-46c8-ae81-2301e8238d0a FS",
      "parent": "4e92a875-f5ff-4dd0-8f41-08853230606d"
    },
    {
      "id": "834399a4-3658-409e-bd06-8c143fe3a29e",
      "text": "Run integrated pilot batches for all SKUs",
      "custom_tooltip": "<b>Run integrated pilot batches for all SKUs</b><br>Execute the coordinated pilot production batches for all 3 SKUs under the locked parameters and lot-code discipline. Enforce descriptor governance (no unauthorized descriptor version changes), run the required in-process seal integrity testing on pilot units, and capture process parameter logs and deviations as they occur. Release outputs only into the next steps (traceability drill + sensory checks) when stop/go criteria for packaging integrity are met.<br><b>Resources needed:</b><br><ul><li>Co-packer/shared kitchen production team</li><li>In-process seal integrity testing operator</li><li>Documentation control/QA coordinator</li><li>Lot-code owner</li><li>Project manager on-call for stop/go decisions</li></ul>",
      "start_date": "2027-01-23",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "06b62d0f-e05f-493c-8388-1eaa6fe004dc FS",
      "parent": "4e92a875-f5ff-4dd0-8f41-08853230606d"
    },
    {
      "id": "005e9f0f-2931-482e-9a03-1a12452ba263",
      "text": "Reconcile results and update readiness evidence",
      "custom_tooltip": "<b>Reconcile results and update readiness evidence</b><br>As the pilot runs complete, reconcile packaging test outcomes, label/traceability drill inputs readiness, and heat sensory sample status into the launch-readiness evidence set. Confirm that each pilot lot has complete traceability mapping artifacts available for the upcoming drill and that sensory sampling occurred at the required timepoints. Produce a short daily/near-real-time discrepancy log and initiate corrective actions to keep the overall pilot stop/go decision on track.<br><b>Resources needed:</b><br><ul><li>Packaging QA &amp; reseal validation specialist</li><li>Label release &amp; traceability coordinator</li><li>Sensory/heat QA lead</li><li>Project manager</li><li>Data analyst (spreadsheet/schema validation) or documentation control support</li></ul>",

    {
      "id": "40ad747f-4fc5-4c79-b43c-84fa2b721b52",
      "text": "Create integrated pilot dependency schedule",
      "custom_tooltip": "<b>Create integrated pilot dependency schedule</b><br>Build and lock a coordinated pilot calendar that synchronizes packaging feasibility runs, label/traceability drill execution, heat QA sensory evaluations, and roast-to-pack validation runs. Define date-locked prerequisites (ingredient readiness, pouch line reservation, label master sign-off, co-packer test window access), assign named owners, and set change-control rules for late label/art changes or supplier documentation gaps.<br><b>Resources needed:</b><br><ul><li>Project milestone lead</li><li>QA/packaging lead</li><li>Label release &amp; traceability coordinator</li><li>Sensory science lead</li><li>Food safety/allergen compliance lead</li><li>Co-packer/shared kitchen operations manager</li></ul>",
      "start_date": "2027-01-25",
      "duration": 1.0,
      "progress": 0,

      "meta": "8971d759-f230-4ac5-932c-3dc6ebee84bf SS",

    {
      "id": "0408b72b-026c-42cd-9522-cd8a26bd4441",
      "text": "Plan pilot lot production batches",
      "custom_tooltip": "<b>Plan pilot lot production batches</b><br>Define pilot lot structure for all 3 SKUs with strict lot-code discipline and locked process parameters (mix order, mixing/rest time targets, fill/seal settings, label attachment steps). Create a pilot batch record per SKU and specify sampling points for in-process seal integrity tests and sensory pulls so evidence can be linked to the correct descriptor versions and timepoints.<br><b>Resources needed:</b><br><ul><li>Co-packer/shared kitchen QA lead</li><li>Food safety &amp; GMP documentation owner</li><li>Packaging QA &amp; reseal/barrier specialist</li><li>Heat QA lead</li><li>Label lot/traceability coordinator</li></ul>",
      "start_date": "2027-01-26",
      "duration": 1.0,

    },
    {
      "id": "c62d3475-8f47-40df-a1fe-dbfc2a691cb5",
      "text": "Run integrated pilot production and controls",
      "custom_tooltip": "<b>Run integrated pilot production and controls</b><br>Execute the integrated pilot production batches across the pouch line with real-time logging and deviation capture. Ensure 100% in-process seal integrity testing for pilot units, enforce label print/attachment verification, and execute descriptor governance as frozen by the label master. Capture all process parameters, lot identifiers, and labeling identifiers needed for traceability and later analysis.<br><b>Resources needed:</b><br><ul><li>Co-packer line operator team</li><li>Co-packer/shared kitchen QA staff</li><li>Packaging test operator</li><li>Label verification/overprint checker</li><li>Project coordinator</li></ul>",
      "start_date": "2027-01-27",
      "duration": 1.0,
      "progress": 0,
      "open": true,

    },
    {
      "id": "1e455b98-5620-40d6-886d-b049112ac3b8",
      "text": "Verify multi-site execution consistency",
      "custom_tooltip": "<b>Verify multi-site execution consistency</b><br>Monitor and confirm execution consistency across shifts/sites (or within the same facility) by reviewing process parameter logs, deviation reports, and evidence completeness. Apply a standardized deviation/stop-go authority workflow, ensuring affected lots are quarantined and the evidence pull for hold/release readiness remains feasible within the 24-hour target.<br><b>Resources needed:</b><br><ul><li>QA documentation control lead</li><li>Packaging QA lead</li><li>Label release owner or delegate</li><li>Co-packer ops manager</li></ul>",
      "start_date": "2027-01-28",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "c62d3475-8f47-40df-a1fe-dbfc2a691cb5 FS",
      "parent": "8971d759-f230-4ac5-932c-3dc6ebee84bf"
    },
    {
      "id": "0c6b0945-a395-451d-a589-bbbf6715364c",
      "text": "Execute end-to-end hold/release drill",
      "custom_tooltip": "<b>Execute end-to-end hold/release drill</b><br>Run a representative end-to-end response drill for at least one likely deviation scenario (e.g., seal integrity failure or label attachment mismatch). Use the mock hold/release binder to retrieve evidence, map the representative lot to the correct label version, determine quarantine scope, and execute the documented disposition workflow. Record time-to-identify, evidence retrieval time, and completeness so pilot stop/go readiness criteria can be concluded.<br><b>Resources needed:</b><br><ul><li>Label release owner</li><li>QA lead</li><li>Food labeling/allergen compliance reviewer</li><li>Co-packer documentation controller</li></ul>",
      "start_date": "2027-01-29",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "8971d759-f230-4ac5-932c-3dc6ebee84bf FF, 1e455b98-5620-40d6-886d-b049112ac3b8 FS",

    },
    {
      "id": "b9a8bf3a-0831-44ce-9cae-6abff7f1face",
      "text": "Verify multi-site/co-packer execution consistency (process logs, deviations handling, stop/go authority enforcement)",
      "custom_tooltip": "<b>Verify multi-site/co-packer execution consistency (process logs, deviations handling, stop/go authority enforcement)</b>",

    {
      "id": "c4829605-3f8b-4981-b56e-26e1d517c020",
      "text": "Require weekly process parameter logs",
      "custom_tooltip": "<b>Require weekly process parameter logs</b><br>Set up a single weekly reporting cadence with the co-packer/shared kitchen to capture all process parameters relevant to sealing, reseal integrity, mixing order-of-operations, dwell/mixing time, label print/attachment steps, and any deviations by SKU and run. Define required fields, formats, and delivery SLA (e.g., by end of day each Friday) and ensure logs are reviewable against the pilot acceptance criteria.<br><b>Resources needed:</b><br><ul><li>Co-packer/shared kitchen QA lead</li><li>Packaging QA &amp; reseal/barrier validation specialist</li><li>Project/milestone lead</li><li>Data manager or QA document control assistant</li></ul>",
      "start_date": "2027-01-30",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "b9a8bf3a-0831-44ce-9cae-6abff7f1face SS",
      "parent": "b9a8bf3a-0831-44ce-9cae-6abff7f1face"
    },
    {
      "id": "d5454241-fbc5-4c70-8784-aad16f8ded15",
      "text": "Implement deviation capture and triage",
      "custom_tooltip": "<b>Implement deviation capture and triage</b><br>Create and enforce a deviation workflow for any process, documentation, or in-process measurement variances observed during pilot runs. Include stop/go authority triggers, deviation severity levels, required evidence attachments, CAPA ownership mapping, and a rapid same-day triage step to decide whether to hold product, correct parameters, or continue under controlled conditions.<br><b>Resources needed:</b><br><ul><li>QA lead with stop/go authority</li><li>Label release &amp; lot-traceability coordinator</li><li>Food labeling/allergen compliance lead (as needed)</li><li>Co-packer/shared kitchen operations supervisor</li></ul>",
      "start_date": "2027-01-31",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "c4829605-3f8b-4981-b56e-26e1d517c020 FS",
      "parent": "b9a8bf3a-0831-44ce-9cae-6abff7f1face"
    },
    {
      "id": "af701737-f7f6-413c-9ec0-52fa6bfe2482",
      "text": "Rehearse evidence pull and reconciliation",
      "custom_tooltip": "<b>Rehearse evidence pull and reconciliation</b><br>For each run, pre-brief the team on what evidence will be required for audit/analysis (process logs, in-process seal checks, label print/attachment verification, and any drill-ready identifiers). Conduct a rehearsal for how records will be located, reconciled, and cross-checked for completeness before the pilot moves to downstream steps, including resolving missing or inconsistent fields within a defined window (e.g., 24 hours).<br><b>Resources needed:</b><br><ul><li>Documentation control/QA lead</li><li>Label release &amp; lot-traceability coordinator</li><li>Packaging QA &amp; reseal/barrier validation specialist</li><li>Co-packer document controller</li></ul>",
      "start_date": "2027-02-01",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "d5454241-fbc5-4c70-8784-aad16f8ded15 FS",
      "parent": "b9a8bf3a-0831-44ce-9cae-6abff7f1face"
    },
    {
      "id": "621de3d4-4e1d-472b-98ef-3598a3358e23",
      "text": "Verify run-to-run process consistency",
      "custom_tooltip": "<b>Verify run-to-run process consistency</b><br>Compare parameter stability across batches, shifts, and any site changes. Use a standardized comparison checklist to confirm key controls remained within agreed windows (sealing parameters, mixing timing discipline, label placement/overprint tolerance, and in-process test outcomes). Identify the top drivers of variability and document any required process adjustments before repeating runs.<br><b>Resources needed:</b><br><ul><li>Packaging QA &amp; reseal/barrier validation specialist</li><li>Flavor/heat QA lead</li><li>Co-packer process engineer</li><li>Statistical analyst or QA data reviewer</li></ul>",
      "start_date": "2027-02-02",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "af701737-f7f6-413c-9ec0-52fa6bfe2482 FS",
      "parent": "b9a8bf3a-0831-44ce-9cae-6abff7f1face"
    },
    {
      "id": "58ddbd11-5472-4a0e-a7d1-6975b28eddde",
      "text": "Confirm deviations are captured for drill",
      "custom_tooltip": "<b>Confirm deviations are captured for drill</b><br>Ensure every deviation observed during pilot execution is also reflected in the traceability drill inputs and the hold/release binder readiness set. Validate that affected lots can be mapped to the correct label versions, seal integrity outcomes, and disposition steps so the end-to-end response drill can be run without improvisation or missing evidence.<br><b>Resources needed:</b><br><ul><li>Label release &amp; lot-traceability coordinator</li><li>QA lead</li><li>Co-packer/shared kitchen QA lead</li><li>Project/milestone lead</li></ul>",
      "start_date": "2027-02-03",
      "duration": 1.0,
      "progress": 0,
      "open": true,
      "meta": "b9a8bf3a-0831-44ce-9cae-6abff7f1face FF, 621de3d4-4e1d-472b-98ef-3598a3358e23 FS",
      "parent": "b9a8bf3a-0831-44ce-9cae-6abff7f1face"
    },
    {
      "id": "4c5af7a1-936e-4037-b97b-b607eb7b32d2",
      "text": "Run end-to-end hold/release and traceability response drills for at least one representative deviation scenario",
      "custom_tooltip": "<b>Run end-to-end hold/release and traceability response drills for at least one representative deviation scenario</b>",
      "progress": 0,
      "open": true,
      "meta": "b9a8bf3a-0831-44ce-9cae-6abff7f1face FS",
